          the foundation, start nginx-staging\n\nnginx will be stopped now and stays stopped until cutover or abandon.\nproceed? [y/N] y<\/code><\/pre>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1"],"R/c/n/tmp":["s1"],"R/c/n/usr":["s1"],"R/c/n/usr/local":["s1"],"R/c/n/var":["s1"],"R/c/n/www":["s1"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{},"frame":19,"arrows":[]},{"kind":"frame","where":"Act IV, frame 20","title":"Stop nginx, then snapshot: s2","html":"<pre class=\"\"><code>service jail stop nginx\nzfs snapshot -r -o shtetl:kind=save \\\n    -o shtetl:commit=&quot;update to generic@15.1-releng-2026-11-12-5b2c7e01a9d4&quot; \\\n    -o shtetl:config=fast/shtetl/config@2026-11-12-090000 \\\n    fast/shtetl/run/containers/nginx@save-2026-11-12-090000<\/code><\/pre><p>An ordinary save snapshot, atomic across the whole tree, called <b>s2<\/b> (orange: the update starts here). Nothing has written to nginx since the stop, and nothing will until cutover or abandon.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{"R/c/n":"snap","R/c/n/tmp":"snap","R/c/n/usr":"snap","R/c/n/usr/local":"snap","R/c/n/var":"snap","R/c/n/www":"snap"},"frame":20,"arrows":[]},{"kind":"frame","where":"Act IV, frame 21","title":"Two saves, two steps, two bases","html":"<p><code>update.depth<\/code> is 0 here, so the update keeps the whole history zrun holds: it replays s1, then s2, onto v2, one rebase per save and dataset. zfs_rebase moves one snapshot at a time, so this is how a container's saves survive an update.<\/p><div class=\"diagram\"><svg viewBox=\"0 0 760 320\" role=\"img\" aria-label=\"The two replay steps and their bases\">\n<defs><marker id=\"m-lin\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path class=\"mk mk-rebase\" d=\"M0,0 L10,5 L0,10 z\"/><\/marker><\/defs>\n<text class=\"rds\" x=\"20\" y=\"44\">foundations/generic<\/text>\n<line class=\"lin\" x1=\"40\" y1=\"70\" x2=\"720\" y2=\"70\"/>\n<path class=\"lin\" d=\"M170,79 C170,140 200,170 240,170 L470,170\"/>\n<text class=\"rds\" x=\"20\" y=\"200\">containers/nginx<\/text>\n<path class=\"lin lin-new\" d=\"M430,79 C430,220 470,270 510,270 L720,270\"/>\n<text class=\"rds\" x=\"20\" y=\"300\">containers/nginx-staging<\/text>\n<path class=\"ar ar-rebase\" stroke-dasharray=\"5 4\" d=\"M290,180 C300,250 470,276 548,272\" marker-end=\"url(#m-lin)\"/>\n<path class=\"ar ar-rebase\" stroke-dasharray=\"5 4\" d=\"M400,180 C420,235 600,232 660,260\" marker-end=\"url(#m-lin)\"/>\n<circle class=\"badge badge-rebase\" cx=\"352\" cy=\"238\" r=\"9\"/>\n<text class=\"badgetext\" x=\"352\" y=\"242\" text-anchor=\"middle\">1<\/text>\n<circle class=\"badge badge-rebase\" cx=\"520\" cy=\"224\" r=\"9\"/>\n<text class=\"badgetext\" x=\"520\" y=\"228\" text-anchor=\"middle\">2<\/text>\n<circle class=\"ldot ldot-version\" cx=\"170\" cy=\"70\" r=\"9\"/>\n<text class=\"ltext\" x=\"170\" y=\"52\" text-anchor=\"middle\">v1<\/text>\n<circle class=\"ldot ldot-version\" cx=\"430\" cy=\"70\" r=\"9\"/>\n<text class=\"ltext\" x=\"430\" y=\"52\" text-anchor=\"middle\">v2<\/text>\n<circle class=\"ldot ldot-save\" cx=\"290\" cy=\"170\" r=\"8\"/>\n<text class=\"ltext\" x=\"290\" y=\"155\" text-anchor=\"middle\">s1<\/text>\n<circle class=\"ldot ldot-from\" cx=\"400\" cy=\"170\" r=\"8\"/>\n<text class=\"ltext\" x=\"400\" y=\"155\" text-anchor=\"middle\">s2<\/text>\n<circle class=\"ldot ldot-save\" cx=\"560\" cy=\"270\" r=\"8\"/>\n<text class=\"ltext\" x=\"560\" y=\"300\" text-anchor=\"middle\">s1'<\/text>\n<circle class=\"ldot ldot-save\" cx=\"670\" cy=\"270\" r=\"8\"/>\n<text class=\"ltext\" x=\"670\" y=\"300\" text-anchor=\"middle\">s2'<\/text>\n<\/svg><\/div><div class=\"tablewrap\"><table class=\"cast\">\n<tr><th>step<\/th><th>from<\/th><th>onto<\/th><th>base<\/th><th>result<\/th><\/tr>\n<tr><td>1<\/td><td><code>nginx@s1<\/code><\/td><td><code>generic@v2<\/code><\/td>\n<td><code>generic@v1<\/code>, found from the origins<\/td>\n<td>a new clone of v2, <code>nginx-staging<\/code>; snapshotted as\n<b>s1'<\/b><\/td><\/tr>\n<tr><td>2<\/td><td><code>nginx@s2<\/code><\/td><td><code>nginx-staging<\/code>\n(the dataset)<\/td><td><code>nginx@s1<\/code>, named<\/td>\n<td>the same dataset, rebased in place; snapshotted as <b>s2'<\/b><\/td><\/tr>\n<\/table><\/div><p><b>1<\/b> The first step names only from and onto. The tool walks each side's origin chain: <code>nginx@s1<\/code>, then nginx's origin <code>generic@v1<\/code>; <code>generic@v2<\/code>, the same dataset. Of the two snapshots the walks name there, the older is the base: v1. So step 1 replays everything nginx changed up to s1 onto v2, and that is where the conflicts are.<\/p>\n<p><b>2<\/b> The second step names its base: s1. Left to derive it, the tool would find v1, the divergence point, again (both origins still meet at the foundation). But onto is now the result so far, which already holds s1: with base v1, a file the admin edited both before s1 and before s2 would look changed on both sides and conflict, and every conflict answered in step 1 would come back, since from still holds the admin's version, onto the merged one, and both differ from v1. With base s1, only what the admin changed between s1 and s2 is replayed, the way git replays each commit against its own parent. Naming a base takes <code>--allow-unrelated<\/code> today, which turns the tool's prune off, so this step reads every file; the box suite has run that flag only as a dry run so far. Probe P14 measures it, and the numbers decide whether zfs_rebase should learn to prune from's side when the base is an earlier snapshot of from's own dataset (planning.md 7.6.2; ruled: not now).<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{},"frame":21,"arrows":[]},{"kind":"frame","where":"Act IV, frame 22","title":"Step 1, the top dataset: s1 onto v2","html":"<p>First shtetl mounts the foundation's datasets on zrun, read-only, at <code>/shtetl/foundations/generic<\/code>: zfs_rebase reads base, from and onto at their own mountpoints. Then, parent first, zfs_rebase clones <b>1<\/b> onto (v2) as <code>nginx-staging<\/code>, mounted only at its own private directory, and replays <b>2<\/b> from's changes (s1 against the base v1) into it.<\/p><pre class=\"\"><code>zfs_rebase --from fast/shtetl/run/containers/nginx@save-2026-10-09-101500 \\\n    --onto fast/shtetl/run/foundations/generic@15.1-releng-2026-11-12-5b2c7e01a9d4 \\\n    --result fast/shtetl/run/containers/nginx-staging<\/code><\/pre><p>Every clean action is applied first: the admin's nginx.conf, rc.conf line, home directory and so on, and every file the errata changed that the admin did not. Then the tool stops at its conflicts gate and exits 1. Six names were changed on both sides: <code>etc/group<\/code>, <code>etc/master.passwd<\/code>, <code>etc/passwd<\/code>, <code>etc/pwd.db<\/code>, <code>etc/spwd.db<\/code>, <code>etc/ssh/sshd_config<\/code>. The tool merges nothing by itself, however far apart the two edits are.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f/G","R/f/G/tmp","R/f/G/usr/local","R/f/G/var"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only","R/c/ns":"private mount, exit 1"}},"hl":{"R/c/ns":"new"},"frame":22,"arrows":[{"a":"R/f/G","b":"R/c/ns","kind":"rebase","num":1,"side":"R","bulge":48,"t":0.3},{"a":"R/c/n","b":"R/c/ns","kind":"rebase","num":2,"side":"R","bulge":24,"t":0.5}]},{"kind":"frame","where":"Act IV, frame 23","title":"At the gate: the derived files step aside","html":"<p>The tool has written a resolution document beside its manifest: one line per conflicted name, each waiting for <code>keep<\/code>, <code>onto<\/code> or <code>from<\/code>. (Shown schematically; the grammar is v4-manifest.md section 8.)<\/p><div class=\"codes\">\n<div class=\"codebox\"><div class=\"fname\">the resolution, as the tool wrote it<\/div><pre class=\"\"><code>#rebase-resolution 5\n#base fast/shtetl/run/foundations/generic@15.1-releng-2026-10-08-0f691888dc56 ...\n#from fast/shtetl/run/containers/nginx@save-2026-10-09-101500 ...\n#onto fast/shtetl/run/foundations/generic@15.1-releng-2026-11-12-5b2c7e01a9d4 ...\n#mode strict\n#names 6\n#unanswered 6\n/\n    etc/\n        group conflict 1 -\n        master.passwd conflict 2 -\n        passwd conflict 3 -\n        pwd.db conflict 4 -\n        spwd.db conflict 5 -\n        ssh/\n            sshd_config conflict 6 -\n            ..\n        ..\n    ..<\/code><\/pre><\/div>\n<div class=\"codebox\"><div class=\"fname\">after shtetl&#x27;s pass<\/div><pre class=\"\"><code>#unanswered 3\n...\n        group conflict 1 -\n        master.passwd conflict 2 -\n        passwd conflict 3 keep        &lt;- derivation, regenerated later\n        pwd.db conflict 4 keep        &lt;- derivation, regenerated later\n        spwd.db conflict 5 keep       &lt;- derivation, regenerated later\n        ...\n            sshd_config conflict 6 -<\/code><\/pre><\/div>\n<\/div><p>shtetl matches the conflicted names against the recipe's <code>derivations<\/code>. <code>passwd<\/code>, <code>pwd.db<\/code> and <code>spwd.db<\/code> are all generated from <code>master.passwd<\/code>, so nobody should have to choose between two versions of them: shtetl answers them <code>keep<\/code> and remembers to regenerate them. It cannot regenerate them yet, because their source is itself still in conflict.<\/p><div class=\"callout callout-note\"><div class=\"ctitle\">The text first (ruled 2026-10-08)<\/div><p>A derived file almost never conflicts alone: whoever changed the binary changed its source too, and a source changed on both sides is itself a conflict, since zfs_rebase never merges text on its own. So the derivation runs after the source has been merged: two passes at the gate, this frame and the next two. zfs_rebase's planned merge drivers (future-features.md) would do it headless whenever the text merges cleanly, given rules that run in the order written.<\/p><\/div>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f/G","R/f/G/tmp","R/f/G/usr/local","R/f/G/var"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only","R/c/ns":"private mount, exit 1"}},"hl":{},"frame":23,"arrows":[]},{"kind":"frame","where":"Act IV, frame 24","title":"At the gate: the admin merges the text","html":"<p>shtetl opens the picker and holds the rebase at the gate:<\/p><pre class=\"\"><code>zfs_rebase --continue -i --no-merge fast/shtetl/run/containers/nginx-staging<\/code><\/pre><pre class=\"sketch\"><code> nginx-staging                          3 of 6 unanswered\n   etc/group               conflict   -\n   etc/master.passwd       conflict   -\n   etc/passwd              conflict   keep\n   etc/pwd.db              conflict   keep\n   etc/spwd.db             conflict   keep\n   etc/ssh/sshd_config     conflict   -<\/code><\/pre><p>(a sketch of the list screen, not the tool's exact drawing)<\/p><p><code>etc/group<\/code> and <code>etc/master.passwd<\/code>: the admin opens each into the merge screen. The errata added a system user near the top, the admin added <code>ploni<\/code> at the end; the three-way merge has no conflict chunk, so <code>w<\/code> writes the merged file into the tree and the line becomes <code>keep<\/code>.<\/p>\n<p><code>etc/ssh/sshd_config<\/code>: the errata rewrote the commented <code>#PermitRootLogin<\/code> default, the very line the admin had replaced with <code>PermitRootLogin no<\/code>. That is one conflict chunk; the admin picks their own side for it, the errata's other changes to the file come along as onto-only chunks, <code>w<\/code> writes, and the line becomes <code>keep<\/code>.<\/p>\n<p>The picker exits. <code>--no-merge<\/code> means the gate stands even though the document is complete, which is what shtetl needs for the next step.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f/G","R/f/G/tmp","R/f/G/usr/local","R/f/G/var"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only","R/c/ns":"private mount, exit 1"}},"hl":{},"frame":24,"arrows":[]},{"kind":"frame","where":"Act IV, frame 25","title":"At the gate: regenerate, then finish","html":"<p>Now the source is merged in the tree, so the derivation can run. The three conflicted outputs share one command, so it runs once, in a chroot of the result's private mount:<\/p><pre class=\"\"><code>chroot &lt;private mount of nginx-staging&gt; pwd_mkdb -p -d /etc /etc/master.passwd\n\nzfs_rebase --continue fast/shtetl/run/containers/nginx-staging\n    applying2 ... done, verified: exit 0<\/code><\/pre><p><code>passwd<\/code>, <code>pwd.db<\/code> and <code>spwd.db<\/code> now agree with the merged <code>master.passwd<\/code>, and their lines already say <code>keep<\/code>, which is exactly \"leave what is in the tree\". <code>--continue<\/code> applies the rest, runs the final check and reaches done: <code>nginx-staging<\/code> now holds s1's tree on v2. The tool hands it back unmounted, read-only, <code>mountpoint=none<\/code>, and shtetl places it at once (<code>zfs inherit mountpoint<\/code>, <code>readonly=off<\/code>): step 2 takes it as a dataset, and the dataset form takes only a mounted one.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f/G","R/f/G/tmp","R/f/G/usr/local","R/f/G/var"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only","R/c/ns":"private mount, exit 1"}},"hl":{},"frame":25,"arrows":[]},{"kind":"frame","where":"Act IV, frame 26","title":"Step 2, the top dataset: s2 onto the result","html":"<pre class=\"\"><code>zfs_rebase --allow-unrelated \\\n    --base fast/shtetl/run/containers/nginx@save-2026-10-09-101500 \\\n    --from fast/shtetl/run/containers/nginx@save-2026-11-12-090000 \\\n    --onto fast/shtetl/run/containers/nginx-staging \\\n    --result save-2026-10-09-101500\n    ... done, verified: exit 0\n\nzfs snapshot -o shtetl:kind=save -o shtetl:replayed-from=&lt;guid of nginx@s2&gt; \\\n    -o shtetl:commit=&quot;update to generic@15.1-releng-2026-11-12-5b2c7e01a9d4&quot; \\\n    fast/shtetl/run/containers/nginx-staging@save-2026-11-12-090000<\/code><\/pre><p><b>1<\/b> The dataset form: onto is <code>nginx-staging<\/code> itself, and the snapshot the tool takes of it before applying anything, named by <code>--result<\/code>, is exactly s1 replayed onto v2: <b>s1'<\/b>, under s1's own name. With base s1, only what changed in nginx between s1 and s2 is applied, which in the top dataset is nearly nothing (the logs are in <code>var<\/code>). No conflict: the six answered in step 1 are not asked again, because the admin did not touch those files after s1. Then shtetl takes <b>s2'<\/b> under s2's name. Both carry the originals' messages and <code>shtetl:replayed-from<\/code>.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/f/G","R/f/G/tmp","R/f/G/usr/local","R/f/G/var"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"],"R/c/ns":["s1'","s2'"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only","R/c/ns":"exit 0"}},"hl":{"R/c/ns":"snap"},"frame":26,"arrows":[{"a":"R/c/n","b":"R/c/ns","kind":"rebase","num":1,"side":"R","bulge":24,"t":0.5}]},{"kind":"frame","where":"Act IV, frame 27","title":"The children, www, and starting the new tree","html":"<p><b>1<\/b> Each child replays the same two steps into the matching name under <code>nginx-staging<\/code>: <code>tmp<\/code>, <code>usr/local<\/code> and <code>var<\/code> (one drawn), each placed after its step 1 so that step 2 can take it. Step 1 finds each child's base through the foundation's matching dataset; step 2 names the child's own s1. None conflicts. <code>var<\/code>'s logs and pkg database land on the new base's <code>var<\/code>.<\/p>\n<p><b>3<\/b> <code>usr<\/code> is a placeholder with <code>canmount=off<\/code>: never mounted, so it can never be a rebase's side, and it holds nothing anyway. shtetl clones it from <code>generic/usr@v2<\/code>, <code>-o canmount=off<\/code>, before <code>usr/local<\/code>'s result is created under it.<\/p><p><b>2<\/b> <code>www<\/code> has no foundation counterpart and nothing in a foundation update touches it, so it is never replayed: its whole \"rebase\" is <code>zfs clone nginx/www@s2 nginx-staging/www<\/code>.<\/p>\n<p>Then shtetl unmounts the foundation's datasets, snapshots the tree, mounted at <code>/containers/nginx-staging<\/code>, with the version it now sits on (<b>v2<\/b>, <code>shtetl:kind=version<\/code>), and starts it as a jail with nginx's own settings, address included: nginx is stopped, so nothing collides. The order matters: each dataset's whole replay finishes before any child of it is made, because zfs_rebase refuses a step on a parent while a child is mounted below it (P4).<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/c/ns/tmp","R/c/ns/usr","R/c/ns/usr/local","R/c/ns/var","R/c/ns/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/c/ns/tmp","R/c/ns/usr/local","R/c/ns/var","R/c/ns/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"],"R/c/n/usr/local":["s1","s2"],"R/c/n/var":["s1","s2"],"R/c/n/www":["s1","s2"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"],"R/c/ns":["s1'","s2'","v2"],"R/c/ns/tmp":["s1'","s2'","v2"],"R/c/ns/usr/local":["s1'","s2'","v2"],"R/c/ns/var":["s1'","s2'","v2"],"R/c/ns/usr":["v2"],"R/c/ns/www":["v2"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  stopped","R/c/n/usr":"canmount=off","R/c/n/www":"container-only","R/c/ns/usr":"clone of generic/usr@v2","R/c/ns/www":"clone of nginx/www@s2","R/c/ns":"jail"}},"hl":{"R/c/ns":"new","R/c/ns/tmp":"new","R/c/ns/usr":"new","R/c/ns/usr/local":"new","R/c/ns/var":"new","R/c/ns/www":"new"},"frame":27,"arrows":[{"a":"R/f/G/var","b":"R/c/ns/var","kind":"rebase","num":1,"side":"R","bulge":56,"t":0.25},{"a":"R/c/n/var","b":"R/c/ns/var","kind":"rebase","num":null,"side":"R","bulge":34,"t":0.5},{"a":"R/c/n/www","b":"R/c/ns/www","kind":"clone","num":2,"side":"R","bulge":20,"t":0.5},{"a":"R/f/G/usr","b":"R/c/ns/usr","kind":"clone","num":3,"side":"R","bulge":66,"t":0.6}]},{"kind":"frame","where":"Act IV, frame 28","title":"Soak","html":"<p>nginx-staging serves; nginx sits stopped and untouched. The admin tries the new tree for as long as they like. If it misbehaves, <code>shtetl abandon nginx<\/code> stops and destroys the staging tree and starts nginx again exactly as it was. A <code>shtetl pkg-upgrade nginx-staging<\/code> here would add a <code>-pkg<\/code> snapshot, so the plain and upgraded states would both be there to pick from.<\/p><p>Saving the staging tree, <b>s3<\/b> \"soak start\", mirrors it into zlake. <b>1<\/b> First nginx's s2 goes to zlake if it is not there yet (<code>send -i s1 s2<\/code>), because <b>3<\/b> the mirror of <code>nginx-staging/www<\/code> is a clone of zlake's <code>nginx/www@s2<\/code>, exactly as on zrun. <b>2<\/b> The replayed datasets go as clone streams of zlake's foundation <code>@v2<\/code>, carrying s1', s2' and v2 with them (<code>send -I<\/code>).<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/c/ns","L/c/ns/tmp","L/c/ns/usr","L/c/ns/usr/local","L/c/ns/var","L/c/ns/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/c/ns/tmp","R/c/ns/usr","R/c/ns/usr/local","R/c/ns/v }]},{"kind":"frame","where":"Act IV, frame 29","title":"Cutover on zrun","html":"<p>The soak went well. Cutover is the admin's decision, made by command. nginx has been stopped since s2, so there is nothing to reconcile; had the admin started it again during the soak, shtetl would say how much it wrote and ask.<\/p><pre class=\"\"><code>$ shtetl cutover nginx\nnginx has not been written since the update started (written@s2 = 0).\ncut over to nginx-staging? [y/N] y<\/code><\/pre><p>shtetl stops the staging jail. <b>1<\/b> <code>zfs promote nginx-staging/www<\/code>: the clone takes over <code>www<\/code>'s snapshots up to s2, so the site's history moves with it (probe P11). Then the old tree is destroyed on zrun; it lives on in zlake. <b>2<\/b> <code>zfs rename nginx-staging nginx<\/code>. Mountpoints follow by inheritance, so the new tree is now at <code>/containers/nginx<\/code>; the jail block is renamed and the jail started.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/c/ns","L/c/ns/tmp","L/c/ns/usr","L/c/ns/usr/local","L/c/ns/var","L/c/ns/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/c/ns/tmp","R/c/ns/usr","R/c/ns/usr/local","R/c/ns/var","R/c/ns/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/c/ns","R/c/ns/tmp","R/c/ns/usr/local","R/c/ns/var","R/c/ns/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1","s2"],"R/c/n/tmp":["s1","s2"],"R/c/n/usr":["s1","s2"] /c/n":"new","L/a/c/n/tmp":"new","L/a/c/n/usr":"new","L/a/c/n/usr/local":"new","L/a/c/n/var":"new","L/a/c/n/www":"new","L/c/ns/www":"write"},"frame":30,"arrows":[{"a":"L/c/n","b":"L/a/c/n","kind":"rename","num":1,"side":"L","bulge":40,"t":0.5}]},{"kind":"frame","where":"Act IV, frame 31","title":"Cutover in zlake: the staging mirror becomes nginx","html":"<p><b>1<\/b> <code>zfs rename<\/code> of <code>containers/nginx-staging<\/code> to <code>containers/nginx<\/code>, matching zrun. zlake's <code>nginx<\/code> is now a clone of zlake's foundation <code>@v2<\/code> carrying s1' and s2', and its <code>www<\/code> carries the site's whole history.<\/p><div class=\"callout callout-note\"><div class=\"ctitle\">Drawn as done, and proven on the box<\/div><p>These moves rest on ZFS behaviour: a clone stream lands as a clone (P1), a child keeps receiving incremental sends after its parent changes lineage or name (P2), and a promote can be mirrored across pools (P11). The box confirmed all three on 2026-10-11.<\/p><\/div>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/a/c/n","L/a/c/n/tmp","L/a/c/n/usr","L/a/c/n/usr/local","L/a/c/n/var","L/a/c/n/www","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/c/ns","L/c/ns/tmp","L/c/ns/usr","L/c/ns/usr/local","L/c/ns/var","L/c/ns/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1'","s2'","v2","s3"],"R/c/n/tmp":["s1'","s2'","v2","s3"],"R/c/n/usr":["v2","s3"],"R/c/n/usr/local":["s1'","s2'","v2","s3"],"R/c/n/var":["s1'","s2'","v2","s3"],"R/c/n/www":["s1","s2","v2","s3"],"L/a/c/n":["s1","s2"],"L/a/c/n/tmp":["s1","s2"],"L/a/c/n/usr":["s1","s2"],"L/a/c/n/usr/local":["s1","s2"],"L/a/c/n/var":["s1","s2"],"L/a/c/n/www":[],"L/c/n":["s1'","s2'","v2","s3"],"L/c/n/tmp":["s1'","s2'","v2","s3"],"L/c/n/usr":["s1'","s2'","v2","s3"],"L/c/n/usr/local":["s1'","s2'","v2","s3"],"L/c/n/var":["s1'","s2'","v2","s3"],"L/c/n/www":["s1","s2","v2","s3"],"L/c/ns":["s1'","s2'","v2","s3"],"L/c/ns/tmp":["s1'","s2'","v2","s3"],"L/c/ns/usr":["s1'","s2'","v2","s3"],"L/c/ns/usr/local":["s1'","s2'","v2","s3"],"L/c/ns/var":["s1'","s2'","v2","s3"],"L/c/ns/www":["s1","s2","v2","s3"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"clone of generic/usr@v2","R/c/n/www":"promoted"}},"hl":{"L/c/ns":"move","L/c/ns/tmp":"move","L/c/ns/usr":"move","L/c/ns/usr/local":"move","L/c/ns/var":"move","L/c/ns/www":"move","L/c/n":"new","L/c/n/tmp":"new","L/c/n/usr":"new","L/c/n/usr/local":"new","L/c/n/var":"new","L/c/n/www":"new"},"frame":31,"arrows":[{"a":"L/c/ns","b":"L/c/n","kind":"rename","num":1,"side":"L","bulge":30,"t":0.5}]},{"kind":"frame","where":"Act IV, frame 32","title":"Where everything stands","html":"<p>The end of one cycle. nginx runs on v2 with everything the admin did, merged with everything the errata did, and with its history: s1 and s2 replayed as s1' and s2'. <b>1<\/b> Its first save after cutover, <b>s5<\/b>, \"cut over\", goes to the renamed mirror as an ordinary incremental.<\/p><p>The next errata, or the next release, starts again at Act III: build into the same foundation, send the increment, stop, replay into staging, soak, cut over. Nothing in the cycle needed git beyond sharing recipes, and nothing was written into a running tree except by the admin and by the jail's own <code>pkg<\/code> and <code>commands<\/code> at creation.<\/p>\n<p>Following a container across its updates (a proposal, planning.md section 8):<\/p><pre class=\"\"><code>$ shtetl log nginx\nnginx                          on generic@15.1-releng-2026-11-12-5b2c7e01a9d4\n  @save-2026-11-20-181500      cut over\n  @save-2026-11-12-094500      soak start\n  @15.1-releng-2026-11-12-...  version\n  @save-2026-11-12-090000      update to ...           replayed from nginx@s2\n  @save-2026-10-09-101500      site live, ploni added  replayed from nginx@s1\narchive/containers/nginx-2026-11-20\n                               on generic@15.1-releng-2026-10-08-0f691888dc56\n  @save-2026-11-12-090000      update to ...\n  @save-2026-10-09-101500      site live, ploni added<\/code><\/pre><div class=\"callout callout-note\"><div class=\"ctitle\">Three policies decide how much of this is kept<\/div><p><code>retention.run<\/code>: the saves on zrun, and zlake's mirror keeps the same. <code>retention.archive<\/code>: the retired trees. <code>update.depth<\/code>: how many saves an update replays, never more than zrun keeps. Each is 0 (everything), a number, or a quoted interval such as <code>\"7d\"<\/code>.<\/p><\/div>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/a/c/n","L/a/c/n/tmp","L/a/c/n/usr","L/a/c/n/usr/local","L/a/c/n/var","L/a/c/n/www","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1'","s2'","v2","s3","s5"],"R/c/n/tmp":["s1'","s2'","v2","s3","s5"],"R/c/n/usr":["v2","s3","s5"],"R/c/n/usr/local":["s1'","s2'","v2","s3","s5"],"R/c/n/var":["s1'","s2'","v2","s3","s5"],"R/c/n/www":["s1","s2","v2","s3","s5"],"L/a/c/n":["s1","s2"],"L/a/c/n/tmp":["s1","s2"],"L/a/c/n/usr":["s1","s2"],"L/a/c/n/usr/local":["s1","s2"],"L/a/c/n/var":["s1","s2"],"L/a/c/n/www":[],"L/c/n":["s1'","s2'","v2","s3","s5"],"L/c/n/tmp":["s1'","s2'","v2","s3","s5"],"L/c/n/usr":["s1'","s2'","v2","s3","s5"],"L/c/n/usr/local":["s1'","s2'","v2","s3","s5"],"L/c/n/var":["s1'","s2'","v2","s3","s5"],"L/c/n/www":["s1","s2","v2","s3","s5"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"clone of generic/usr@v2"}},"hl":{"R/c/n":"snap","R/c/n/tmp":"snap","R/c/n/usr":"snap","R/c/n/usr/local":"snap","R/c/n/var":"snap","R/c/n/www":"snap","L/c/n":"snap","L/c/n/tmp":"snap","L/c/n/usr":"snap","L/c/n/usr/local":"snap","L/c/n/var":"snap","L/c/n/www":"snap"},"frame":32,"arrows":[{"a":"R/c/n","b":"L/c/n","kind":"save","num":1,"side":null,"bulge":30,"t":0.5}]},{"kind":"act","where":"Epilogue","title":"What the box said","html":"<p>Everything above is drawn as designed, and some of it rests on ZFS and zfs_rebase behaving the way the design assumes. Milestone M0 tested each assumption with a standalone probe on a throwaway pool before any of shtetl is built (planning.md section 13); the box answered on 2026-10-11.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/a/c/n","L/a/c/n/tmp","L/a/c/n/usr","L/a/c/n/usr/local","L/a/c/n/var","L/a/c/n/www","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1'","s2'","v2","s3","s5"],"R/c/n/tmp":["s1'","s2'","v2","s3","s5"],"R/c/n/usr":["v2","s3","s5"],"R/c/n/usr/local":["s1'","s2'","v2","s3","s5"],"R/c/n/var":["s1'","s2'","v2","s3","s5"],"R/c/n/www":["s1","s2","v2","s3","s5"],"L/a/c/n":["s1","s2"],"L/a/c/n/tmp":["s1","s2"],"L/a/c/n/usr":["s1","s2"],"L/a/c/n/usr/local":["s1","s2"],"L/a/c/n/var":["s1","s2"],"L/a/c/n/www":[],"L/c/n":["s1'","s2'","v2","s3","s5"],"L/c/n/tmp":["s1'","s2'","v2","s3","s5"],"L/c/n/usr":["s1'","s2'","v2","s3","s5"],"L/c/n/usr/local":["s1'","s2'","v2","s3","s5"],"L/c/n/var":["s1'","s2'","v2","s3","s5"],"L/c/n/www":["s1","s2","v2","s3","s5"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"clone of generic/usr@v2"}},"hl":{},"arrows":[],"frame":0},{"kind":"frame","where":"Epilogue, frame 33","title":"What each assumption was, and what the box said","html":"<div class=\"tablewrap\"><table class=\"cast\"><tr><th>the story assumes<\/th><th>probe<\/th><th>where<\/th><th>the box<\/th><\/tr><tr><td>A clone stream from zrun lands in zlake as a clone of zlake's own foundation, so zlake stores only the delta<\/td><td style=\"white-space:nowrap\"><code>P1<\/code><\/td><td><a href=\"#slide-18\" data-slide=\"18\">frame 14<\/a><\/td><td>Yes, without <code>-o origin<\/code><\/td><\/tr><tr><td>A snapshot's <code>shtetl:commit<\/code> and <code>shtetl:config<\/code> reach zlake<\/td><td style=\"white-space:nowrap\"><code>P10<\/code><\/td><td><a href=\"#slide-18\" data-slide=\"18\">frame 14<\/a><\/td><td>Only with <code>send -p<\/code>, which carries local properties too; shtetl copies them after the receive (ruled)<\/td><\/tr><tr><td>Each dataset of a foundation can be cloned on its own, and the clones mount by inheritance in the right order<\/td><td style=\"white-space:nowrap\"><code>P7, P9<\/code><\/td><td><a href=\"#slide-15\" data-slide=\"15\">frame 11<\/a><\/td><td>Yes, parent first, the placeholder cloned <code>-o canmount=off<\/code><\/td><\/tr><tr><td>installworld over the previous version plus delete-old leaves nothing that matters behind<\/td><td style=\"white-space:nowrap\"><code>P6<\/code><\/td><td><a href=\"#slide-21\" data-slide=\"21\">frame 16<\/a><\/td><td>Not quite: backups, unlisted old files, certificate links; open (Q-P)<\/td><\/tr><tr><td>Installing with <code>install -C<\/code> keeps unchanged files untouched, so the rebase can prune them<\/td><td style=\"white-space:nowrap\"><code>P12<\/code><\/td><td><a href=\"#slide-21\" data-slide=\"21\">frame 16<\/a><\/td><td>Yes: the send 38 MiB against 1,010; open (Q-O)<\/td><\/tr><tr><td>A file whose bytes the new version did not change does not conflict with the admin's edit of it<\/td><td style=\"white-space:nowrap\"><code>P5<\/code><\/td><td><a href=\"#slide-28\" data-slide=\"28\">frame 22<\/a><\/td><td>Yes, synthetic and on a real world<\/td><\/tr><tr><td>The foundation copy, mounted read-only for the update, is read at its mountpoint; a <code>canmount=off<\/code> placeholder is refused as a side and can be cloned instead<\/td><td style=\"white-space:nowrap\"><code>P16<\/code><\/td><td><a href=\"#slide-28\" data-slide=\"28\">frame 22<\/a>, <a href=\"#slide-33\" data-slide=\"33\">frame 27<\/a><\/td><td>Yes<\/td><\/tr><tr><td>A replay step runs with <code>--allow-unrelated --base<\/code> in the dataset form, its pre-apply snapshot is the replayed save, and its cost is acceptable<\/td><td style=\"white-space:nowrap\"><code>P14<\/code><\/td><td><a href=\"#slide-32\" data-slide=\"32\">frame 26<\/a><\/td><td>Yes; a step compares about 10 GB on an 865 MiB tree<\/td><\/tr><tr><td>A rebase can create its result under an already placed result<\/td><td style=\"white-space:nowrap\"><code>P4<\/code><\/td><td><a href=\"#slide-33\" data-slide=\"33\">frame 27<\/a><\/td><td>Yes; a parent's step waits until no child is mounted below it<\/td><\/tr><tr><td><code>written@s2<\/code> tells cutover whether the old tree was started again during the soak<\/td><td style=\"white-space:nowrap\"><code>P8<\/code><\/td><td><a href=\"#slide-35\" data-slide=\"35\">frame 29<\/a><\/td><td>Yes with atime off; with atime on, reads alone count<\/td><\/tr><tr><td>Promoting a container-only clone, on zrun and again in zlake, keeps its incremental chain<\/td><td style=\"white-space:nowrap\"><code>P3, P11<\/code><\/td><td><a href=\"#slide-35\" data-slide=\"35\">frame 29<\/a>, <a href=\"#slide-36\" data-slide=\"36\">frame 30<\/a><\/td><td>Yes<\/td><\/tr><tr><td>A child keeps receiving incremental sends after its parent is renamed or changes lineage<\/td><td style=\"white-space:nowrap\"><code>P2<\/code><\/td><td><a href=\"#slide-37\" data-slide=\"37\">frame 31<\/a><\/td><td>Yes<\/td><\/tr><tr><td>A release change built into the same foundation can be rebased onto<\/td><td style=\"white-space:nowrap\"><code>P15<\/code><\/td><td>not drawn; Act III's note<\/td><td>Yes, 15.0 to 16.0-CURRENT: one conflict, <code>/etc/group<\/code><\/td><\/tr><tr><td>Several lake or run roots, and the one-match rule<\/td><td style=\"white-space:nowrap\"><code>P13<\/code><\/td><td>not drawn: this story has one root per space<\/td><td>Yes<\/td><\/tr><\/table><\/div><p>Every frame above stands. Three details changed: the placeholder is cloned <code>-o canmount=off<\/code>, a dataset is replayed whole before its children, and sends go without <code>-p<\/code>. Two questions are open: <code>install -C<\/code> for every install, and what an update leaves behind (planning.md section 15).<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/a/c/n","L/a/c/n/tmp","L/a/c/n/usr","L/a/c/n/usr/local","L/a/c/n/var","L/a/c/n/www","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1","v2"],"L/f/G/tmp":["v1","v2"],"L/f/G/usr":["v1","v2"],"L/f/G/usr/local":["v1","v2"],"L/f/G/var":["v1","v2"],"R/f/G":["v1","v2"],"R/f/G/tmp":["v1","v2"],"R/f/G/usr":["v1","v2"],"R/f/G/usr/local":["v1","v2"],"R/f/G/var":["v1","v2"],"R/c/n":["s1'","s2'","v2","s3","s5"],"R/c/n/tmp":["s1'","s2'","v2","s3","s5"],"R/c/n/usr":["v2","s3","s5"],"R/c/n/usr/local":["s1'","s2'","v2","s3","s5"],"R/c/n/var":["s1'","s2'","v2","s3","s5"],"R/c/n/www":["s1","s2","v2","s3","s5"],"L/a/c/n":["s1","s2"],"L/a/c/n/tmp":["s1","s2"],"L/a/c/n/usr":["s1","s2"],"L/a/c/n/usr/local":["s1","s2"],"L/a/c/n/var":["s1","s2"],"L/a/c/n/www":[],"L/c/n":["s1'","s2'","v2","s3","s5"],"L/c/n/tmp":["s1'","s2'","v2","s3","s5"],"L/c/n/usr":["s1'","s2'","v2","s3","s5"],"L/c/n/usr/local":["s1'","s2'","v2","s3","s5"],"L/c/n/var":["s1'","s2'","v2","s3","s5"],"L/c/n/www":["s1","s2","v2","s3","s5"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"clone of generic/usr@v2"}},"hl":{},"frame":33,"arrows":[]}],"pillKind":{"v1":"version","v2":"version","s1":"save","s2":"from","s3":"save","s5":"save","s1'":"save","s2'":"save"},"arrowClass":{"build":"build","install":"build","checkout":"build","send":"lake","save":"lake","clone":"run","rebase":"rebase","rename":"muted","promote":"muted"}}</script>
<script>
(function () {
'use strict';
const D = JSON.parse(document.getElementById('story-data').textContent);
const G = D.geom, SLIDES = D.slides;
const NS = 'http://www.w3.org/2000/svg';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const svg = $('map');
const EASE = 'cubic-bezier(.2, .7, .2, 1)';

function S(tag, attrs, parent) {
	const e = document.createElementNS(NS, tag);
	for (const k in attrs) e.setAttribute(k, attrs[k]);
	if (parent) parent.appendChild(e);
	return e;
}

/* ---- running animations: finished at once when the reader moves on ---- */

let running = [];
let instant = false;
function anim(el, frames, opts, done) {
	if (instant || reduced || !el.animate) { if (done) done(); return; }
	const a = el.animate(frames, Object.assign({ easing: EASE, fill: 'backwards' }, opts));
	running.push(a);
	if (done) a.onfinish = () => { done(); a.cancel(); };
}
function settle() {
	const r = running;
	running = [];
	for (const a of r) if (a.playState !== 'finished') a.finish();
}

/* ---- the map, built once ---- */

const SP = {};
for (const s of G.spaces) SP[s.key] = Object.assign({ x2: s.x + s.w }, s);
const gBoxes = S('g', {}, svg);
for (const s of G.spaces) {
	S('rect', { class: 'box box-' + s.key, x: s.x, y: s.y, width: s.w, height: s.h, rx: 8 }, gBoxes);
	S('text', { class: 'slabel slabel-' + s.key, x: s.x + 14, y: s.y + 22 }, gBoxes).textContent = s.label;
	S('text', { class: 'ssub', x: s.x + 14, y: s.y + 38 }, gBoxes).textContent = s.sub;
}
const gRows = S('g', {}, svg);
const gArrows = S('g', {}, svg);
const ROWS = {};
const ROWLIST = [];
for (const r of G.rows) {
	const sp = SP[r.key];
	const g = S('g', { class: 'row' }, gRows);
	g.style.display = 'none';
	const hl = S('rect', { class: 'hl', x: sp.x + 4, y: r.top + 1, width: sp.w - 8, height: G.ROW - 2, rx: 4 }, g);
	const dot = S('circle', { class: 'mdot', cx: sp.x + 12, cy: r.cy, r: 3.5 }, g);
	dot.style.display = 'none';
	const nm = S('text', { class: 'nm nm-' + r.kind, x: r.tx, y: r.cy + 4 }, g);
	nm.textContent = r.label;
	const end = r.tx + r.label.length * G.CW;
	const strike = S('line', { class: 'strike', x1: r.tx - 2, y1: r.cy, x2: end + 2, y2: r.cy }, g);
	strike.style.display = 'none';
	const tag = S('text', { class: 'tag', x: end + 8, y: r.cy + 4 }, g);
	const pills = S('g', {}, g);
	const row = { id: r.id, r, sp, g, hl, dot, strike, tag, pills, pillEls: new Map(),
		on: false, hlKind: null, mounted: false, tagText: '' };
	ROWS[r.id] = row;
	ROWLIST.push(row);
}

/* ---- arrows: the same routes story.py draws ---- */

function cy(id) { return ROWS[id].r.cy; }
function route(a, b, side, bulge) {
	const sa = SP[a[0]], sb = SP[b[0]];
	const ya = cy(a), yb = cy(b);
	bulge = bulge == null ? 30 : bulge;
	if (sa === sb) {
		if (side == null) side = sa.key === 'R' ? 'R' : 'L';
		if (side === 'R') { const e = sa.x2; return [[e, ya], [e + bulge, ya], [e + bulge, yb], [e + 2, yb]]; }
		const e = sa.x; return [[e, ya], [e - bulge, ya], [e - bulge, yb], [e - 2, yb]];
	}
	if (sa.x2 <= sb.x) {
		const p0 = [sa.x2, ya], p3 = [sb.x - 2, yb], d = (p3[0] - p0[0]) * 0.45;
		return [p0, [p0[0] + d, ya], [p3[0] - d, yb], p3];
	}
	const p0 = [sa.x, ya], p3 = [sb.x2 + 2, yb], d = (p0[0] - p3[0]) * 0.45;
	return [p0, [p0[0] - d, ya], [p3[0] + d, yb], p3];
}
function bez(p, t) {
	const u = 1 - t;
	return [0, 1].map((i) => u * u * u * p[0][i] + 3 * u * u * t * p[1][i] + 3 * u * t * t * p[2][i] + t * t * t * p[3][i]);
}

let beads = [];
function drawArrows(slide, t0) {
	settleArrows();
	slide.arrows.forEach((a, i) => {
		const cls = D.arrowClass[a.kind];
		const p = route(a.a, a.b, a.side, a.bulge);
		const g = S('g', {}, gArrows);
		const path = S('path', { class: 'ar ar-' + cls,
			d: 'M' + p[0] + ' C' + p[1] + ' ' + p[2] + ' ' + p[3] }, g);
		const len = path.getTotalLength();
		const start = t0 + i * 180, dur = 650;
		if (cls === 'muted') {
			anim(path, [{ opacity: 0 }, { opacity: 1 }], { duration: dur, delay: start });
		} else {
			anim(path, [{ strokeDasharray: len + ' ' + len, strokeDashoffset: len },
				{ strokeDasharray: len + ' ' + len, strokeDashoffset: 0 }],
				{ duration: dur, delay: start, easing: 'ease-in-out' });
		}
		const dx = p[3][0] - p[2][0], dy = p[3][1] - p[2][1];
		const ang = Math.atan2(dy, dx) * 180 / Math.PI;
		const head = S('path', { class: 'head-' + cls, d: 'M0,0 L-9,-4.5 L-9,4.5 z',
			transform: 'translate(' + p[3][0] + ',' + p[3][1] + ') rotate(' + ang + ')' }, g);
		anim(head, [{ opacity: 0 }, { opacity: 1 }], { duration: 160, delay: start + dur - 80 });
		if (a.num != null) {
			const m = bez(p, a.t == null ? 0.5 : a.t);
			const bg = S('g', {}, g);
			S('circle', { class: 'badge-' + cls, cx: m[0], cy: m[1], r: 9 }, bg);
			S('text', { class: 'badgetext', x: m[0], y: m[1] + 4, 'text-anchor': 'middle' }, bg).textContent = String(a.num);
			anim(bg, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: start + dur * 0.5 });
		}
		if (!reduced && cls !== 'muted') {
			for (let k = 0; k < 2; k++) {
				const bead = S('circle', { class: 'bead-' + cls, r: 2.6, cx: p[0][0], cy: p[0][1] }, g);
				bead.style.opacity = '0';
				beads.push({ bead, path, len, phase: k / 2, at: performance.now() + (instant ? 0 : start + dur) });
			}
		}
	});
}
function settleArrows() {
	beads = [];
	while (gArrows.firstChild) gArrows.removeChild(gArrows.firstChild);
}
function beadLoop(now) {
	for (const b of beads) {
		if (now < b.at) continue;
		const t = ((now - b.at) / 2600 + b.phase) % 1;
		const pt = b.path.getPointAtLength(t * b.len);
		b.bead.setAttribute('cx', pt.x);
		b.bead.setAttribute('cy', pt.y);
		b.bead.style.opacity = '1';
	}
	requestAnimationFrame(beadLoop);
}
if (!reduced) requestAnimationFrame(beadLoop);

/* ---- one slide's state ---- */

function pillWidth(p) { return p.length * G.PW + 10; }

function setPills(row, list, t0) {
	const want = list.slice(-3);
	const xs = [];
	let px = row.sp.x2 - 8;
	for (let i = want.length - 1; i >= 0; i--) {
		px -= pillWidth(want[i]);
		xs[i] = px;
		px -= 4;
	}
	const y = row.r.cy - 7.5;
	for (const [name, el] of row.pillEls) {
		if (want.includes(name)) continue;
		row.pillEls.delete(name);
		anim(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: 'forwards' }, () => el.remove());
		if (instant || reduced) el.remove();
	}
	want.forEach((name, i) => {
		const to = 'translate(' + xs[i] + 'px, ' + y + 'px)';
		let el = row.pillEls.get(name);
		if (el) {
			const from = el.style.transform;
			el.style.transform = to;
			if (from !== to) anim(el, [{ transform: from }, { transform: to }], { duration: 380, delay: t0 });
			return;
		}
		el = S('g', { class: 'pill pill-' + D.pillKind[name] }, row.pills);
		const w = pillWidth(name);
		S('rect', { width: w, height: 15, rx: 7.5 }, el);
		S('text', { x: w / 2, y: 11, 'text-anchor': 'middle' }, el).textContent = name;
		el.style.transform = to;
		row.pillEls.set(name, el);
		anim(el, [{ opacity: 0, transform: 'translate(' + xs[i] + 'px, ' + (y - 12) + 'px)' },
			{ opacity: 1, transform: to }], { duration: 420, delay: t0 + 120 + i * 80 });
	});
}

function apply(slide) {
	const st = slide.state;
	const present = new Set(st.present), mounted = new Set(st.mounted);
	const t0 = (instant || reduced) ? 0 : 380;
	let enter = 0;
	for (const row of ROWLIST) {
		const on = present.has(row.id);
		if (on && !row.on) {
			row.g.style.display = '';
			anim(row.g, [{ opacity: 0, transform: 'translateX(-10px)' }, { opacity: 1, transform: 'none' }],
				{ duration: 420, delay: t0 + Math.min(enter++, 12) * 35 });
		} else if (!on && row.on) {
			const g = row.g;
			anim(g, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' },
				() => { if (!row.on) g.style.display = 'none'; });
			if (instant || reduced) g.style.display = 'none';
		}
		row.on = on;
		if (!on) continue;
		const hk = slide.hl[row.id] || null;
		if (hk !== row.hlKind) {
			row.hl.setAttribute('class', 'hl' + (hk ? ' hl-' + hk : ''));
			if (hk) anim(row.hl, [{ opacity: 0 }, { opacity: 1 }], { duration: 380, delay: t0 + 60 });
			row.hlKind = hk;
		}
		if (hk === 'write') anim(row.hl, [{ opacity: 1 }, { opacity: 0.45 }, { opacity: 1 }],
			{ duration: 900, delay: t0 + 500, iterations: 2, easing: 'ease-in-out', fill: 'none' });
		if (hk === 'gone') {
			row.strike.style.display = '';
			const len = Math.abs(row.strike.x2.baseVal.value - row.strike.x1.baseVal.value);
			anim(row.strike, [{ strokeDasharray: len + ' ' + len, strokeDashoffset: len },
				{ strokeDasharray: len + ' ' + len, strokeDashoffset: 0 }], { duration: 420, delay: t0 + 200 });
		} else {
			row.strike.style.display = 'none';
		}
		const m = mounted.has(row.id);
		if (m !== row.mounted) {
			row.dot.style.display = m ? '' : 'none';
			if (m) anim(row.dot, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: t0 + 150 });
			row.mounted = m;
		}
		const tag = st.tags[row.id] || '';
		if (tag !== row.tagText) {
			row.tag.textContent = tag;
			if (tag) anim(row.tag, [{ opacity: 0 }, { opacity: 1 }], { duration: 320, delay: t0 + 100 });
			row.tagText = tag;
		}
		setPills(row, st.pills[row.id] || [], t0);
	}
	drawArrows(slide, t0 + 260);
}

/* ---- the view ---- */

const WHOLE = { x: -10, y: -10, w: G.W + 20, h: G.H + 20 };
let vb = Object.assign({}, WHOLE);
let follow = true, camAnim = null;

function setVB(v) {
	vb = v;
	svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
}
function aspect() {
	const r = svg.getBoundingClientRect();
	return r.width > 0 && r.height > 0 ? r.width / r.height : G.W / G.H;
}
function fit(box) {
	const ar = aspect();
	let w = Math.max(box.w, 560), h = Math.max(box.h, 280);
	if (w / h > ar) h = w / ar; else w = h * ar;
	if (w >= WHOLE.w && h >= WHOLE.h) return fitWhole();
	const cx = box.x + box.w / 2, cyy = box.y + box.h / 2;
	return { x: cx - w / 2, y: cyy - h / 2, w, h };
}
function fitWhole() {
	const ar = aspect();
	let w = WHOLE.w, h = WHOLE.h;
	if (w / h > ar) h = w / ar; else w = h * ar;
	return { x: WHOLE.x + WHOLE.w / 2 - w / 2, y: WHOLE.y + WHOLE.h / 2 - h / 2, w, h };
}
function focusBox(slide) {
	const ids = new Set(Object.keys(slide.hl));
	let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
	const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
	for (const a of slide.arrows) {
		ids.add(a.a); ids.add(a.b);
		for (const pt of route(a.a, a.b, a.side, a.bulge)) add(pt[0], pt[1]);
	}
	for (const id of ids) {
		const row = ROWS[id];
		if (!row) continue;
		add(row.sp.x, row.r.top - 30);
		add(row.sp.x2, row.r.top + G.ROW + 10);
	}
	if (!isFinite(x0)) return null;
	return { x: x0 - 30, y: y0 - 70, w: x1 - x0 + 60, h: y1 - y0 + 100 };
}
function moveView(to) {
	if (instant || reduced) { setVB(to); camAnim = null; return; }
	camAnim = { from: Object.assign({}, vb), to, t0: performance.now(), dur: 700 };
	requestAnimationFrame(camStep);
}
function camStep(now) {
	if (!camAnim) return;
	let t = Math.min(1, (now - camAnim.t0) / camAnim.dur);
	const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
	const f = camAnim.from, to = camAnim.to;
	setVB({ x: f.x + (to.x - f.x) * e, y: f.y + (to.y - f.y) * e,
		w: f.w + (to.w - f.w) * e, h: f.h + (to.h - f.h) * e });
	if (t < 1) requestAnimationFrame(camStep); else camAnim = null;
}
function focus(slide) {
	if (!follow) return;
	const box = focusBox(slide);
	moveView(box ? fit(box) : fitWhole());
}
function setFollow(on) {
	follow = on;
	$('follow').setAttribute('aria-pressed', String(on));
}
$('follow').addEventListener('click', () => {
	setFollow(!follow);
	if (follow && current >= 0) focus(SLIDES[current]);
});
$('whole').addEventListener('click', () => { setFollow(false); moveView(fitWhole()); });

/* drag to pan, wheel to zoom */
let drag = null;
svg.addEventListener('pointerdown', (e) => {
	drag = { x: e.clientX, y: e.clientY, vb: Object.assign({}, vb) };
	svg.setPointerCapture(e.pointerId);
	svg.classList.add('dragging');
});
svg.addEventListener('pointermove', (e) => {
	if (!drag) return;
	const r = svg.getBoundingClientRect();
	const s = drag.vb.w / r.width;
	if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) { setFollow(false); camAnim = null; }
	setVB({ x: drag.vb.x - (e.clientX - drag.x) * s, y: drag.vb.y - (e.clientY - drag.y) * s, w: drag.vb.w, h: drag.vb.h });
});
const endDrag = () => { drag = null; svg.classList.remove('dragging'); };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', (e) => {
	e.preventDefault();
	setFollow(false);
	camAnim = null;
	const r = svg.getBoundingClientRect();
	const k = Math.exp(e.deltaY * 0.0015);
	const w = Math.min(Math.max(vb.w * k, 200), WHOLE.w * 2.5);
	const f = w / vb.w;
	const mx = vb.x + (e.clientX - r.left) / r.width * vb.w;
	const my = vb.y + (e.clientY - r.top) / r.height * vb.h;
	setVB({ x: mx - (mx - vb.x) * f, y: my - (my - vb.y) * f, w, h: vb.h * f });
}, { passive: false });
window.addEventListener('resize', () => { if (follow && current >= 0) { instant = true; focus(SLIDES[current]); instant = false; } });

/* ---- the slide text ---- */

let current = -1;
function slideFromHash() {
	const m = /^#slide-(\d+)$/.exec(location.hash);
	const n = m ? parseInt(m[1], 10) - 1 : 0;
	return Math.min(Math.max(n, 0), SLIDES.length - 1);
}
function show(k, now) {
	if (k < 0 || k >= SLIDES.length) return;
	settle();
	instant = !!now;
	current = k;
	const s = SLIDES[k];
	$('where').textContent = s.where;
	$('title').textContent = s.title;
	$('text').innerHTML = s.html;
	$('text').scrollTop = 0;
	$('counter').textContent = (k + 1) + ' of ' + SLIDES.length;
	$('prev').disabled = k === 0;
	$('next').disabled = k === SLIDES.length - 1;
	$('next').textContent = k === 0 ? 'Begin' : 'Next';
	document.querySelectorAll('.tick').forEach((t, i) => {
		t.classList.toggle('current', i === k);
		t.classList.toggle('done', i < k);
		if (i === k) t.setAttribute('aria-current', 'step'); else t.removeAttribute('aria-current');
	});
	history.replaceState(null, '', '#slide-' + (k + 1));
	focus(s);
	apply(s);
	instant = false;
}
const tl = $('timeline');
SLIDES.forEach((s, i) => {
	const b = document.createElement('button');
	b.className = 'tick' + (s.kind !== 'frame' ? ' act' : '');
	const label = (s.where ? s.where + ': ' : '') + s.title;
	b.title = label;
	b.setAttribute('aria-label', label);
	b.addEventListener('click', () => show(i));
	tl.appendChild(b);
});
$('prev').addEventListener('click', () => show(current - 1));
$('next').addEventListener('click', () => show(current + 1));
$('text').addEventListener('click', (e) => {
	const a = e.target.closest('a[data-slide]');
	if (!a) return;
	e.preventDefault();
	show(parseInt(a.dataset.slide, 10) - 1);
});
document.addEventListener('keydown', (e) => {
	if (e.altKey || e.ctrlKey || e.metaKey) return;
	if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(current + 1); e.preventDefault(); }
	else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(current - 1); e.preventDefault(); }
	else if (e.key === 'Home') { show(0); e.preventDefault(); }
	else if (e.key === 'End') { show(SLIDES.length - 1); e.preventDefault(); }
});
window.addEventListener('hashchange', () => {
	const k = slideFromHash();
	if (k !== current) show(k);
});

setVB(fitWhole());
show(slideFromHash(), true);
})();
</script>
</body>
</html>
