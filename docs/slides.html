* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0;
	background: var(--stage);
	color: var(--ink);
	font: 17px/1.55 "Newsreader", Georgia, serif;
	display: grid;
	grid-template-columns: minmax(330px, 31rem) minmax(0, 1fr);
	overflow: hidden;
}
code, pre { font-family: "IBM Plex Mono", Menlo, monospace; }
code { font-size: 0.8em; background: var(--code-bg); padding: 1px 4px;
	border-radius: 3px; }
pre { font-size: 12px; line-height: 1.5; background: var(--code-bg);
	padding: 10px 12px; border-radius: 4px; overflow-x: auto;
	margin: 10px 0 14px; }
pre code { background: none; padding: 0; font-size: inherit; }
pre.sketch { outline: 1px dashed var(--line); }
a { color: var(--accent); }

/* the slide text */
.placard {
	background: var(--paper);
	border-right: 1px solid var(--line);
	display: flex;
	flex-direction: column;
	height: 100vh;
	min-width: 0;
}
.placard header { padding: 22px 26px 10px; }
.where {
	font: 600 13px/1.3 "Archivo", "Helvetica Neue", Arial, sans-serif;
	color: var(--muted);
	margin: 0 0 6px;
	min-height: 1em;
}
.placard h1 {
	font: 700 26px/1.15 "Archivo", "Helvetica Neue", Arial, sans-serif;
	letter-spacing: -0.01em;
	margin: 0;
}
.slide-body { flex: 1; overflow-y: auto; padding: 4px 26px 20px; }
.slide-body p { margin: 0 0 12px; max-width: 62ch; }
.slide-body p code { overflow-wrap: anywhere; }
.placard footer {
	display: flex; align-items: center; gap: 10px;
	padding: 12px 26px 16px; border-top: 1px solid var(--line);
	font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
.counter { flex: 1; text-align: center; color: var(--muted); font-size: 14px;
	font-variant-numeric: tabular-nums; }
button {
	font: 600 15px "Archivo", "Helvetica Neue", Arial, sans-serif;
	color: var(--ink); background: transparent;
	border: 1.5px solid var(--ink); border-radius: 999px;
	padding: 7px 16px; cursor: pointer;
}
button.primary { background: var(--ink); color: var(--paper); }
button:disabled { opacity: 0.3; cursor: default; }
button:focus-visible, a:focus-visible, .tick:focus-visible {
	outline: 3px solid var(--accent); outline-offset: 2px; }

/* the story's own panels */
.tablewrap { overflow-x: auto; }
.cast { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 14px; }
.cast td, .cast th { text-align: left; vertical-align: top; padding: 4px 6px;
	border-bottom: 1px solid var(--line); }
.cast th { font: 600 12px "Archivo", sans-serif; color: var(--muted); }
.codes { display: grid; gap: 4px; }
.fname { font: 600 12px "Archivo", sans-serif; color: var(--muted); margin-top: 8px; }
.checks { border-top: 1px solid var(--line); padding: 8px 0; margin: 8px 0; }
.checks .ctitle { font: 600 13px "Archivo", sans-serif; color: var(--muted);
	margin-bottom: 4px; }
.checks ul { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 44px 1fr; gap: 8px;
	padding: 3px 0; font-size: 15px; }
.cs { font: 600 10.5px "IBM Plex Mono", monospace; color: var(--paper);
	border-radius: 3px; text-align: center; height: 17px; line-height: 17px;
	margin-top: 4px; }
.cs-ok { background: var(--ok); } .cs-warn { background: var(--warn); }
.cs-fail { background: var(--fail); } .cs-note { background: var(--muted); }
.cs-prop { background: var(--prop); }
.callout { border-left: 3px solid var(--c); padding: 4px 0 4px 12px; margin: 12px 0; }
.callout .ctitle { font: 700 14px "Archivo", sans-serif; color: var(--c); }
.callout p { margin: 4px 0; font-size: 15.5px; }
.callout-finding { --c: var(--a-build); }
.callout-question { --c: var(--prop); }
.callout-note { --c: var(--accent); }
.diagram { margin: 10px 0; overflow-x: auto; }
.diagram svg { width: 100%; min-width: 520px; height: auto; display: block; }
.diagram svg text { font-family: "Archivo", sans-serif; fill: var(--ink); }
.diagram svg .rds, .diagram svg .ltext { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
.diagram svg .lin { fill: none; stroke: var(--muted); stroke-width: 3; }
.diagram svg .lin-new { stroke: var(--a-run); stroke-dasharray: 6 4; }
.diagram svg .ldot { stroke: var(--paper); stroke-width: 2; }
.diagram svg .ldot-version { fill: var(--version); }
.diagram svg .ldot-save { fill: var(--save); }
.diagram svg .ldot-from { fill: var(--from); }
.diagram svg .ar { fill: none; stroke-width: 2.4; }
.diagram svg .ar-rebase { stroke: var(--a-rebase); }
.diagram svg .mk-rebase { fill: var(--a-rebase); }
.diagram svg .badge-rebase { fill: var(--a-rebase); }
.diagram svg .badgetext { font-size: 11px; font-weight: 700; fill: var(--paper); }

/* the map */
#stage { position: relative; overflow: hidden; min-width: 0; }
#map { position: absolute; top: 0; left: 0; right: 0; bottom: 46px; width: 100%; height: calc(100% - 46px);
	touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
#map text { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
#map .box { fill: var(--box); stroke-width: 2; }
#map .box-C { stroke: var(--sp-config); } #map .box-B { stroke: var(--sp-build); }
#map .box-L { stroke: var(--sp-lake); } #map .box-R { stroke: var(--sp-run); }
#map .slabel { font-size: 15px; font-weight: 700; }
#map .slabel-C { fill: var(--sp-config); } #map .slabel-B { fill: var(--sp-build); }
#map .slabel-L { fill: var(--sp-lake); } #map .slabel-R { fill: var(--sp-run); }
#map .ssub { font-size: 11px; fill: var(--muted); }
#map .nm { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 12px; }
#map .nm-root { font-weight: 600; }
#map .nm-file, #map .nm-dir { fill: var(--muted); font-style: italic; }
#map .tag { font-size: 10.5px; fill: var(--muted); }
#map .mdot { fill: var(--ink); }
#map .hl { fill: transparent; }
#map .hl-new { fill: var(--hl-new); } #map .hl-write { fill: var(--hl-write); }
#map .hl-read { fill: var(--hl-read); } #map .hl-snap { fill: var(--hl-snap); }
#map .hl-gone { fill: var(--hl-gone); } #map .hl-move { fill: var(--hl-move); }
#map .strike { stroke: var(--strike); stroke-width: 1.6; }
#map .pill rect { stroke: none; }
#map .pill-version rect { fill: var(--version); }
#map .pill-save rect { fill: var(--save); }
#map .pill-from rect { fill: var(--from); }
#map .pill text { font: 600 10.5px "IBM Plex Mono", monospace; fill: var(--box); }
#map .pill-from text { fill: var(--from-ink); }
#map .ar { fill: none; stroke-width: 2; stroke-linecap: round; }
#map .ar-build { stroke: var(--a-build); } #map .ar-lake { stroke: var(--a-lake); }
#map .ar-run { stroke: var(--a-run); } #map .ar-rebase { stroke: var(--a-rebase); stroke-width: 2.6; }
#map .ar-muted { stroke: var(--a-muted); stroke-dasharray: 5 4; }
#map .head-build, #map .bead-build, #map .badge-build { fill: var(--a-build); }
#map .head-lake, #map .bead-lake, #map .badge-lake { fill: var(--a-lake); }
#map .head-run, #map .bead-run, #map .badge-run { fill: var(--a-run); }
#map .head-rebase, #map .bead-rebase, #map .badge-rebase { fill: var(--a-rebase); }
#map .head-muted, #map .bead-muted, #map .badge-muted { fill: var(--a-muted); }
#map .badgetext { font-size: 11px; font-weight: 700; fill: var(--box); }
.tools { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; }
.tools button { background: var(--paper); border-color: var(--line);
	font-size: 13px; padding: 6px 12px; }
.tools button[aria-pressed="true"] { border-color: var(--ink); }
.timeline {
	position: absolute; left: 16px; right: 16px; bottom: 8px; height: 34px;
	display: flex; align-items: flex-end; gap: 2px; overflow-x: auto;
	padding: 4px 2px;
}
.tick { flex: 1 0 8px; height: 14px; border: 0; padding: 0; border-radius: 2px;
	background: var(--line); cursor: pointer; }
.tick.act { height: 22px; background: var(--muted); margin-left: 6px; }
.tick.act:first-child { margin-left: 0; }
.tick.done { background: var(--muted); opacity: 0.55; }
.tick.act.done { opacity: 0.8; }
.tick.current { background: var(--accent); opacity: 1; height: 24px; }
@media (max-width: 820px) {
	body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 48vh 52vh; }
	#stage { grid-row: 1; }
	.placard { grid-row: 2; height: 52vh; border-right: 0;
		border-top: 1px solid var(--line); }
	.placard header { padding: 14px 16px 6px; }
	.slide-body { padding: 4px 16px 14px; }
	.placard footer { padding: 10px 16px 12px; }
	.placard h1 { font-size: 20px; }
}
</style>

,"kind":"ds","key":"R","top":388,"cy":398.0,"tx":764},{"id":"R/c/ns/usr/local","label":"local","depth":4,"kind":"ds","key":"R","top":408,"cy":418.0,"tx":778},{"id":"R/c/ns/var","label":"var","depth":3,"kind":"ds","key":"R","top":428,"cy":438.0,"tx":764},{"id":"R/c/ns/www","label":"www","depth":3,"kind":"ds","key":"R","top":448,"cy":458.0,"tx":764},{"id":"R/s","label":"systems","depth":1,"kind":"ds","key":"R","top":468,"cy":478.0,"tx":736}]},"slides":[{"kind":"title","where":"","title":"shtetl, one cycle","html":"<p>One machine, one foundation, one container. The diagram is the machine's four ZFS spaces, and every slide changes it in place, the way the cycle changes the datasets: a foundation is built, a container is made from it, and the container is moved onto the foundation's next version.<\/p>\n<p>Move with the buttons below, the arrow keys, or the marks along the bottom of the diagram. The view follows each step; drag or scroll the diagram to look around, <b>Whole map<\/b> pulls back, and <b>Follow the story<\/b> hands the view back.<\/p><div class=\"tablewrap\"><table class=\"cast\"><tr><th>name<\/th><th>what it is in this story<\/th><\/tr><tr><td><code>machine<\/code><\/td><td><code>kfar<\/code>: pools <code>fast<\/code> (NVMe, boot) and <code>tank<\/code> (HDD)<\/td><\/tr><tr><td><code>zconfig<\/code><\/td><td><code>fast/shtetl/config<\/code>, the zshtetl-recipes clone, at <code>/shtetl/config<\/code><\/td><\/tr><tr><td><code>zbuild<\/code><\/td><td><code>fast/shtetl/src<\/code>, a freebsd-src checkout<\/td><\/tr><tr><td><code>zlake<\/code><\/td><td><code>tank/shtetl<\/code><\/td><\/tr><tr><td><code>zrun<\/code><\/td><td><code>fast/shtetl/run<\/code>; containers at <code>/containers<\/code><\/td><\/tr><tr><td><code>F<\/code><\/td><td>foundation <code>generic<\/code>, named after its recipe<\/td><\/tr><tr><td><code>v1<\/code><\/td><td><code>@15.1-releng-2026-10-08-0f691888dc56<\/code>, first build<\/td><\/tr><tr><td><code>v2<\/code><\/td><td><code>@15.1-releng-2026-11-12-5b2c7e01a9d4<\/code>, after an errata<\/td><\/tr><tr><td><code>s1<\/code><\/td><td><code>@save-2026-10-09-101500<\/code> \"site live, ploni added\"<\/td><\/tr><tr><td><code>s2<\/code><\/td><td><code>@save-2026-11-12-090000<\/code>, where the update starts<\/td><\/tr><tr><td><code>s1', s2'<\/code><\/td><td>s1 and s2 replayed onto v2 by the update, under the same names<\/td><\/tr><tr><td><code>s3<\/code><\/td><td><code>@save-2026-11-12-094500<\/code> \"soak start\" (staging)<\/td><\/tr><tr><td><code>s5<\/code><\/td><td><code>@save-2026-11-20-181500<\/code> \"cut over\" (new)<\/td><\/tr><\/table><\/div><p>The same story as one long page of diagrams is <a href=\"story.html\">story.html<\/a>.<\/p>","state":{"present":[],"mounted":[],"pills":{},"tags":{}},"hl":{},"arrows":[],"frame":0},{"kind":"act","where":"Act 0","title":"The stage","html":"<p>One machine, <code>kfar<\/code>, with two pools: <code>fast<\/code>, an NVMe mirror it boots from, and <code>tank<\/code>, a raidz of large disks. Its admin installed shtetl and ran <code>shtetl bootstrap<\/code>, naming one existing dataset for each of the four spaces.<\/p>","state":{"present":[],"mounted":[],"pills":{},"tags":{}},"hl":{},"arrows":[],"frame":0},{"kind":"frame","where":"Act 0, frame 1","title":"After bootstrap","html":"<p>Bootstrap touched no device. It set a local user property, <code>shtetl:space<\/code>, on each root, created the empty parents under zlake and zrun with parasa's defaults (<code>atime=off<\/code>, <code>compression=zstd<\/code>, <code>aclmode=passthrough<\/code>, <code>mountpoint=none<\/code>, <code>canmount=noauto<\/code>), and made <code>zrun/containers<\/code> the one parent that mounts by itself, at <code>/containers<\/code>. <code>zrun/foundations<\/code> gets a real mountpoint, <code>/shtetl/foundations<\/code>, but nothing under it mounts by itself (<code>canmount=noauto<\/code>): zfs_rebase reads every side at its own mountpoint, so shtetl mounts a foundation there for the length of an update, and no longer.<\/p>\n<p>zconfig is a clone of the zshtetl-recipes repo: <code>default.conf<\/code> came from upstream, <code>shtetl.conf<\/code> was written by bootstrap. zbuild is a FreeBSD src checkout the admin already had. From here on every frame shows the same four boxes; only what the story does changes.<\/p><p>How to read a frame: a dot before a name means mounted. Pills on the right are snapshots (blue a foundation version, grey a save, orange the snapshot an update starts from). A tinted row was created, written, read or removed in that frame, as the legend at the top says. Numbered arrows are the operations, listed under the diagram.<\/p>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/sc","L","L/a","L/a/c","L/c","L/f","L/fb","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{},"tags":{"B/t":"git checkout","R/c":"/containers","R/f":"/shtetl/foundations"}},"hl":{},"frame":1,"arrows":[]},{"kind":"act","where":"Act I","title":"A foundation","html":"<p>A foundation is FreeBSD built from source by a recipe. Every container and system is a clone of one, so it is built first.<\/p>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/sc","L","L/a","L/a/c","L/c","L/f","L/fb","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{},"tags":{"B/t":"git checkout","R/c":"/containers","R/f":"/shtetl/foundations"}},"hl":{},"arrows":[],"frame":0},{"kind":"frame","where":"Act I, frame 2","title":"The admin writes a foundation recipe","html":"<p>The admin adds <code>foundations/generic.conf<\/code> to the recipes clone. It is three lines: everything else comes from <code>default.conf<\/code>, the base layer every recipe is built on. <code>shtetl.conf<\/code> is not part of any recipe; it holds what is about this machine.<\/p><div class=\"codes\">\n<div class=\"codebox\"><div class=\"fname\">foundations/generic.conf (new)<\/div><pre class=\"\"><code># foundations/generic.conf: a GENERIC kernel and world\nver = &quot;&gt;=15&quot;;\nsrc_branch = &quot;releng/15.1&quot;;\nkernconf = &quot;GENERIC&quot;;<\/code><\/pre><\/div>\n<div class=\"codebox\"><div class=\"fname\">default.conf<\/div><pre class=\"\"><code># default.conf: the base layer of every recipe (from upstream)\n\ndatasets {\n    tmp {}\n    var {}\n    &quot;usr/local&quot; {}\n}\n\nderivations {\n    &quot;etc/passwd&quot; {\n        source = &quot;etc/master.passwd&quot;;\n        command = &quot;pwd_mkdb -p -d /etc /etc/master.passwd&quot;;\n    }\n    &quot;etc/pwd.db&quot; {\n        source = &quot;etc/master.passwd&quot;;\n        command = &quot;pwd_mkdb -p -d /etc /etc/master.passwd&quot;;\n    }\n    &quot;etc/spwd.db&quot; {\n        source = &quot;etc/master.passwd&quot;;\n        command = &quot;pwd_mkdb -p -d /etc /etc/master.passwd&quot;;\n    }\n    &quot;etc/login.conf.db&quot; {\n        source = &quot;etc/login.conf&quot;;\n        command = &quot;cap_mkdb /etc/login.conf&quot;;\n    }\n}<\/code><\/pre><\/div>\n<div class=\"codebox\"><div class=\"fname\">shtetl.conf<\/div><pre class=\"\"><code># shtetl.conf: about this machine (bootstrap&#x27;s starter)\nupdate {\n    suffix = &quot;staging&quot;;\n}\nretention {\n    run = 10;\n    lake = 0;\n    archive = &quot;1y&quot;;\n}<\/code><\/pre><\/div>\n<\/div><div class=\"callout callout-note\"><div class=\"ctitle\">ZFS is the record; git is for sharing<\/div><p>Upstream's <code>.gitignore<\/code> ignores everything upstream does not ship, so <code>shtetl.conf<\/code> and <code>generic.conf<\/code> stay local unless the admin shares one on purpose (<code>git add -f<\/code>). Their history is zconfig's snapshots, and every snapshot shtetl takes records the config snapshot it was made with. One hazard, tested: git overwrites ignored files without a word when a pull brings a file at the same path, so shtetl snapshots zconfig before any pull and refuses one that would collide.<\/p><\/div>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/fb","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{},"tags":{"B/t":"git checkout","R/c":"/containers","R/f":"/shtetl/foundations"}},"hl":{},"frame":2,"arrows":[]},{"kind":"frame","where":"Act I, frame 3","title":"shtetl checks the recipe","html":"<p><code>shtetl build generic<\/code> reads the recipe before it touches anything. The checks run in three rounds; any failure stops the command with the file and line.<\/p><div class=\"checks\"><div class=\"ctitle\">parse (each file alone)<\/div><ul>\n<li><span class=\"cs cs-ok\">ok<\/span><span>default.conf, foundations/generic.conf: UCL, ASCII only<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>no key written twice in one file (parsed with <code>UCL_DUPLICATE_ERROR<\/code>)<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>no macros (<code>.include<\/code>, <code>.priority<\/code>, ...) and no <code>$variables<\/code><\/span><\/li>\n<\/ul><\/div><div class=\"checks\"><div class=\"ctitle\">schema<\/div><ul>\n<li><span class=\"cs cs-ok\">ok<\/span><span>every key is known, and allowed for a foundation (<code>kernconf<\/code> yes; <code>jailconf<\/code>, <code>requires<\/code>, <code>foundation<\/code> no)<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>types: <code>ver<\/code> and <code>src_branch<\/code> are strings; <code>datasets<\/code> and <code>derivations<\/code> are keyed collections<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>dataset names are valid ZFS components; <code>usr/local<\/code> implies a placeholder <code>usr<\/code><\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>every derivation has a <code>source<\/code> and a <code>command<\/code><\/span><\/li>\n<\/ul><\/div><div class=\"checks\"><div class=\"ctitle\">meaning<\/div><ul>\n<li><span class=\"cs cs-ok\">ok<\/span><span><code>releng/15.1<\/code> is version 15.1, branch type releng; it satisfies <code>ver &gt;= 15<\/code><\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>a foundation is named after its recipe: <code>generic<\/code>; no dataset of that name exists in any lake root, so this is a new foundation<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>spaces: one root each for config, build, lake and run<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>after checkout: <code>sys/amd64/conf/GENERIC<\/code> exists in the src tree<\/span><\/li>\n<\/ul><\/div><p>What a failure looks like:<\/p><pre class=\"\"><code>foundations/generic.conf:2: ver must be a string; write &quot;15.10&quot;\n    (UCL read the float 15.1)\ndefault.conf:1: macros are not allowed; use import\nfoundations/generic.conf:5: jailconf is a container key; a foundation\n    cannot set it<\/code><\/pre>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/fb","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{},"tags":{"B/t":"git checkout","R/c":"/containers","R/f":"/shtetl/foundations"}},"hl":{},"frame":3,"arrows":[]},{"kind":"frame","where":"Act I, frame 4","title":"The merged recipe, and the plan","html":"<p>The layers merge (default.conf, then the target) and shtetl can show where every value came from. Then it prints the plan and asks.<\/p><pre class=\"\"><code>$ shtetl config show foundations/generic\nkind         foundation\nname         generic                        (the recipe)\nversion      15.1-releng                    (from src_branch)\nver          &quot;&gt;=15&quot;                         foundations/generic.conf:2\nsrc_branch   &quot;releng/15.1&quot;                  foundations/generic.conf:3\nkernconf     &quot;GENERIC&quot;                      foundations/generic.conf:4\ndatasets     tmp                            default.conf:4\n             usr        placeholder         implied by usr/local\n             usr/local                      default.conf:6\n             var                            default.conf:5\nderivations  etc/passwd        &lt;- etc/master.passwd   default.conf:10\n             etc/pwd.db        &lt;- etc/master.passwd   default.conf:14\n             etc/spwd.db       &lt;- etc/master.passwd   default.conf:18\n             etc/login.conf.db &lt;- etc/login.conf      default.conf:22<\/code><\/pre><pre class=\"\"><code>$ shtetl build generic\nfoundation generic (new), version @15.1-releng-2026-10-08-0f691888dc56\n\n  create   tank/shtetl/foundations/generic\n  create     .../tmp\n  create     .../usr                    canmount=off (placeholder)\n  create     .../usr/local\n  create     .../var\n  create   tank/shtetl/foundation-builds/generic\n  src      fast/shtetl/src: checkout releng/15.1 (0f691888dc56)\n  build    buildworld buildkernel KERNCONF=GENERIC\n           MAKEOBJDIRPREFIX=&lt;foundation-builds/generic&gt;\n  install  installworld installkernel distribution\n           DESTDIR=&lt;foundations/generic&gt;\n  snapshot -r @15.1-releng-2026-10-08-0f691888dc56  shtetl:kind=version\n\nproceed? [y/N] y<\/code><\/pre><div class=\"callout callout-finding\"><div class=\"ctitle\">Finding: usr/local is two datasets<\/div><p>Children mount by inheritance, and an inherited mountpoint is the parent's plus the child's name. A dataset called <code>usr-local<\/code> (parasa's name) would mount at <code>.../usr-local<\/code>, not <code>/usr/local<\/code>. So <code>usr/local<\/code> becomes <code>usr<\/code> with <code>canmount=off<\/code>, holding nothing, and <code>usr/local<\/code> under it, the way FreeBSD's own zroot does it. planning.md and the architecture page are corrected to match.<\/p><\/div>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/fb","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{},"tags":{"B/t":"git checkout","R/c":"/containers","R/f":"/shtetl/foundations"}},"hl":{},"frame":4,"arrows":[]},{"kind":"frame","where":"Act I, frame 5","title":"Pre-split: the datasets exist before any file does","html":"<p>shtetl creates the foundation and one child per recipe dataset, all empty, and an obj cache for this foundation.<\/p><p>Creating the children first is what makes everything later work. A container cloned from this foundation will have its own <code>var<\/code>, <code>usr/local<\/code> and <code>tmp<\/code>, each a clone of the foundation's, and so each one will have a base to rebase from when the foundation moves. A directory split into a dataset after the fact would have no such lineage.<\/p>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{},"tags":{"B/t":"git checkout","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off"}},"hl":{"L/f/G":"new","L/f/G/tmp":"new","L/f/G/usr":"new","L/f/G/usr/local":"new","L/f/G/var":"new","L/fb/G":"new","C/dc":"read","C/fg":"read","C/sc":"read"},"frame":5,"arrows":[]},{"kind":"frame","where":"Act I, frame 6","title":"Build","html":"<p>The src checkout, the obj cache and the foundation tree are mounted (the foundation's children follow by inheritance). The checkout moves to <code>releng/15.1<\/code>.<\/p><p><b>1<\/b> <code>make buildworld buildkernel KERNCONF=GENERIC<\/code> with <code>MAKEOBJDIRPREFIX<\/code> on <code>foundation-builds/generic<\/code>. The obj tree stays there after the build, so the next build of this foundation starts warm (best with <code>WITH_META_MODE<\/code>).<\/p>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/f","R/s"],"mounted":["B","C","L/f/G","L/f/G/tmp","L/f/G/usr/local","L/f/G/var","L/fb/G","R/c"],"pills":{},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off"}},"hl":{"B/t":"write","L/fb/G":"write"},"frame":6,"arrows":[{"a":"B/t","b":"L/fb/G","kind":"build","num":1,"side":null,"bulge":30,"t":0.5}]},{"kind":"frame","where":"Act I, frame 7","title":"Install into the foundation","html":"<p>There is no separate DESTDIR: the build installs straight into the mounted foundation.<\/p><p><b>2<\/b> <code>make installworld installkernel distribution DESTDIR=<\/code>the foundation's mountpoint. Files land in whichever dataset owns their path: <code>/var<\/code> in <code>var<\/code>, the <code>/usr/local<\/code> skeleton in <code>usr/local<\/code>, everything else (<code>/usr<\/code> included, since <code>usr<\/code> is a placeholder) in the foundation's own dataset. A foundation recipe with <code>pkg<\/code> or <code>commands<\/code> would run them now, in a chroot of the tree; this one has neither.<\/p>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/f","R/s"],"mounted":["B","C","L/f/G","L/f/G/tmp","L/f/G/usr/local","L/f/G/var","L/fb/G","R/c"],"pills":{},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off"}},"hl":{"L/f/G":"write","L/f/G/var":"write","L/f/G/tmp":"write","L/f/G/usr/local":"write"},"frame":7,"arrows":[{"a":"L/fb/G","b":"L/f/G","kind":"install","num":2,"side":"R","bulge":34,"t":0.5}]},{"kind":"frame","where":"Act I, frame 8","title":"Snapshot: version v1","html":"<p>Everything is unmounted again and the foundation is snapshotted recursively, in one atomic step, with its properties set at creation.<\/p><pre class=\"\"><code>zfs snapshot -r \\\n    -o shtetl:kind=version \\\n    -o shtetl:commit=&quot;build generic from releng/15.1 0f691888dc56&quot; \\\n    -o shtetl:config=fast/shtetl/config@2026-10-08-140210 \\\n    tank/shtetl/foundations/generic@15.1-releng-2026-10-08-0f691888dc56<\/code><\/pre><p>From here on this page calls that snapshot <b>v1<\/b>. The dataset is named after the recipe and the version is in the snapshot name, <code>@{ver}-{branch-type}-{ISO-date}-{short-sha}<\/code>, so a foundation is one dataset for its whole life: a later <code>@15.2-releng-...<\/code> continues the same chain. The names are for people; shtetl reads <code>shtetl:kind<\/code>, and <code>shtetl:config<\/code> points at the exact recipes this was built from. The foundation lives only in zlake so far. Nothing runs yet.<\/p>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off"}},"hl":{"L/f/G":"snap","L/f/G/tmp":"snap","L/f/G/usr":"snap","L/f/G/usr/local":"snap","L/f/G/var":"snap"},"frame":8,"arrows":[]},{"kind":"act","where":"Act II","title":"A container","html":"<p>The admin wants a web server: nginx, in a jail, on this foundation.<\/p>","state":{"present":["B","B/t","C","C/c","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off"}},"hl":{},"arrows":[],"frame":0},{"kind":"frame","where":"Act II, frame 9","title":"The container recipe, checked","html":"<p><code>containers/nginx.conf<\/code> says which FreeBSD versions it fits, one package, one dataset of its own, one command block and its jail settings. It names no foundation: the admin picks one with <code>shtetl create nginx --on generic<\/code>, and shtetl checks the recipe the same three ways, plus the checks that only make sense for a container.<\/p><div class=\"codes\">\n<div class=\"codebox\"><div class=\"fname\">containers/nginx.conf (new)<\/div><pre class=\"\"><code># containers/nginx.conf\nver = &quot;&gt;=15&quot;;\n\npkg = [ &quot;nginx&quot; ];\n\ndatasets {\n    www {}\n}\n\ncommands {\n    nginx = &lt;&lt;EOD\nsysrc nginx_enable=YES\nEOD\n}\n\njailconf = &lt;&lt;EOD\nhost.hostname = &quot;nginx&quot;;\nip4.addr = &quot;10.0.0.5&quot;;\nEOD<\/code><\/pre><\/div>\n<\/div><div class=\"checks\"><div class=\"ctitle\">container checks<\/div><ul>\n<li><span class=\"cs cs-ok\">ok<\/span><span>parse and schema as before; <code>jailconf<\/code> is a container key<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span><code>--on generic<\/code>: the foundation exists, and its newest version, <code>15.1-releng-2026-10-08-0f691888dc56<\/code>, satisfies <code>ver &gt;= 15<\/code><\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span><code>requires<\/code>: none, so no other container must exist first<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>datasets: <code>tmp<\/code>, <code>usr<\/code>, <code>usr/local<\/code>, <code>var<\/code> exist in the foundation and will be clones; <code>www<\/code> is container-only<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>derivation sources exist in v1 (<code>etc/master.passwd<\/code>, <code>etc/login.conf<\/code>)<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>the name <code>nginx<\/code> is free on zrun and in the zlake mirror<\/span><\/li>\n<li><span class=\"cs cs-ok\">ok<\/span><span>nginx ends with a superset of what the foundation provides: lists are additive, and dropping a dataset the foundation splits (<code>tmp = false<\/code>) or a package it installed would be an error<\/span><\/li>\n<\/ul><\/div><pre class=\"\"><code>$ shtetl config show containers/nginx\nkind         container\nfoundation   generic (chosen with --on), newest version\n             15.1-releng-2026-10-08-0f691888dc56; ver &quot;&gt;=15&quot; allows it\ndatasets     tmp         from the foundation    default.conf:4\n             usr         from the foundation    (placeholder)\n             usr/local   from the foundation    default.conf:6\n             var         from the foundation    default.conf:5\n             www         container-only         containers/nginx.conf:7\npkg          nginx                              containers/nginx.conf:4\ncommands     nginx                              containers/nginx.conf:11\nderivations  (4, as the foundation)             default.conf\njailconf     2 lines                            containers/nginx.conf:16<\/code><\/pre><div class=\"callout callout-note\"><div class=\"ctitle\">Recipes are not tied to a foundation<\/div><p>A recipe says which versions it fits with <code>ver<\/code> and works on any foundation that satisfies it. The choice is made when the container is created, and the clone's <code>origin<\/code> records it from then on: no key, no file.<\/p><\/div>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/f","R/s"],"mounted":["C","R/c"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off"}},"hl":{},"frame":9,"arrows":[]},{"kind":"frame","where":"Act II, frame 10","title":"Bring the foundation to zrun","html":"<p>Clones cannot cross pools, so the foundation first goes where containers run.<\/p><p><b>1<\/b> One <code>zfs send<\/code> per dataset of v1, received under <code>fast/shtetl/run/foundations<\/code> with <code>readonly=on<\/code> and <code>canmount=noauto<\/code>. A full stream this first time; every later version goes as an incremental. The copy has a real mountpoint, <code>/shtetl/foundations/generic<\/code>, but is never mounted except while an update reads it: zfs_rebase reads every side at its own mountpoint and refuses one that is not mounted.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro"}},"hl":{"R/f/G":"new","R/f/G/tmp":"new","R/f/G/usr":"new","R/f/G/usr/local":"new","R/f/G/var":"new","C/cn":"read"},"frame":10,"arrows":[{"a":"L/f/G","b":"R/f/G","kind":"send","num":1,"side":null,"bulge":30,"t":0.5},{"a":"L/f/G/tmp","b":"R/f/G/tmp","kind":"send","num":null,"side":null,"bulge":30,"t":0.5},{"a":"L/f/G/usr","b":"R/f/G/usr","kind":"send","num":null,"side":null,"bulge":30,"t":0.5},{"a":"L/f/G/usr/local","b":"R/f/G/usr/local","kind":"send","num":null,"side":null,"bulge":30,"t":0.5},{"a":"L/f/G/var","b":"R/f/G/var","kind":"send","num":null,"side":null,"bulge":30,"t":0.5}]},{"kind":"frame","where":"Act II, frame 11","title":"Clone, dataset by dataset","html":"<p><code>zfs clone<\/code> is not recursive, so shtetl clones each dataset of v1 to the matching name under <code>containers/nginx<\/code>, then creates the recipe's own <code>www<\/code>.<\/p><p><b>1<\/b> <code>zfs clone<\/code> of each <code>@v1<\/code>. Nothing is copied: the clones share every block with the foundation until something writes. Mountpoints are inherited, so the tree mounts at <code>/containers/nginx<\/code>, <code>/containers/nginx/var<\/code>, and so on, with no fstab. <code>usr<\/code>, the placeholder, is cloned <code>-o canmount=off<\/code>: a clone keeps none of its origin's properties, and without it <code>usr<\/code> would mount over the tree's own <code>/usr<\/code> (P9). <code>www<\/code> has no origin: its history will start at the first save.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{"R/c/n":"new","R/c/n/tmp":"new","R/c/n/usr":"new","R/c/n/usr/local":"new","R/c/n/var":"new","R/c/n/www":"new"},"frame":11,"arrows":[{"a":"R/f/G","b":"R/c/n","kind":"clone","num":1,"side":"R","bulge":22,"t":0.5},{"a":"R/f/G/tmp","b":"R/c/n/tmp","kind":"clone","num":null,"side":"R","bulge":31,"t":0.5},{"a":"R/f/G/usr","b":"R/c/n/usr","kind":"clone","num":null,"side":"R","bulge":40,"t":0.5},{"a":"R/f/G/usr/local","b":"R/c/n/usr/local","kind":"clone","num":null,"side":"R","bulge":49,"t":0.5},{"a":"R/f/G/var","b":"R/c/n/var","kind":"clone","num":null,"side":"R","bulge":58,"t":0.5}]},{"kind":"frame","where":"Act II, frame 12","title":"Start the jail, install, run the commands","html":"<p>shtetl writes the jail's block to <code>/etc/jail.conf.d/nginx.conf<\/code> on the host, from the recipe's <code>jailconf<\/code> and the path, and starts it.<\/p><pre class=\"\"><code>nginx {\n    path = &quot;/containers/nginx&quot;;\n    host.hostname = &quot;nginx&quot;;\n    ip4.addr = &quot;10.0.0.5&quot;;\n    exec.start = &quot;/bin/sh /etc/rc&quot;;\n    exec.stop = &quot;/bin/sh /etc/rc.shutdown&quot;;\n}\n\nservice jail start nginx\npkg -j nginx install -y nginx            # usr/local, and var/db/pkg in var\njexec nginx /bin/sh -c &#x27;sysrc nginx_enable=YES&#x27;   # etc/rc.conf in nginx<\/code><\/pre><p>Commands run once, here, at creation. They never run again: an update carries what they did along with everything else.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{"R/c/n":"write","R/c/n/usr/local":"write","R/c/n/var":"write"},"frame":12,"arrows":[]},{"kind":"frame","where":"Act II, frame 13","title":"Life happens","html":"<p>Weeks of ordinary administration. Each change lands in whichever dataset owns its path:<\/p><pre class=\"\"><code>pw useradd ploni -m             etc/master.passwd etc/passwd etc/group\n                                etc/pwd.db etc/spwd.db     -&gt; nginx\nvi /etc/ssh/sshd_config         PermitRootLogin no         -&gt; nginx\nvi /usr/local/etc/nginx/nginx.conf                         -&gt; nginx/usr/local\nsite content                                               -&gt; nginx/www\nlogs, pkg database                                         -&gt; nginx/var<\/code><\/pre><p>None of this is in any recipe, and none of it needs to be. There is no drift tracking and nothing to classify: the datasets are the record.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{"R/c/n":"write","R/c/n/usr/local":"write","R/c/n/var":"write","R/c/n/www":"write"},"frame":13,"arrows":[]},{"kind":"frame","where":"Act II, frame 14","title":"Save: s1","html":"<p><code>shtetl save nginx -m \"site live, ploni added\"<\/code><\/p><pre class=\"\"><code>zfs snapshot -r -o shtetl:kind=save -o shtetl:commit=&quot;site live, ploni added&quot; \\\n    fast/shtetl/run/containers/nginx@save-2026-10-09-101500<\/code><\/pre><p><b>1<\/b> Each foundation-inherited dataset goes as a clone stream (<code>zfs send -i &lt;run foundation&gt;@v1 nginx@s1<\/code>) and is received in zlake as a clone of zlake's own foundation <code>@v1<\/code>, so zlake stores only what nginx changed. One arrow per kind is drawn; every dataset of the tree goes the same way. <b>2<\/b> <code>www<\/code> has no origin, so its first save is a full stream. From now on zlake mirrors nginx as of its last save: same names, same clone relationships, one pool over. Whether the clone streams land as clones without help: they do (P1).<\/p>\n<p>This snapshot is <b>s1<\/b>; its message is in <code>shtetl:commit<\/code>. The sends carry no properties (no <code>-p<\/code>, which would carry the dataset's local ones too), so after each receive shtetl copies the snapshot's <code>shtetl:*<\/code> properties onto zlake's copy (P10).<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"],"R/c/n":["s1"],"R/c/n/tmp":["s1"],"R/c/n/usr":["s1"],"R/c/n/usr/local":["s1"],"R/c/n/var":["s1"],"R/c/n/www":["s1"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{"R/c/n":"snap","R/c/n/tmp":"snap","R/c/n/usr":"snap","R/c/n/usr/local":"snap","R/c/n/var":"snap","R/c/n/www":"snap","L/c/n":"new","L/c/n/tmp":"new","L/c/n/usr":"new","L/c/n/usr/local":"new","L/c/n/var":"new","L/c/n/www":"new"},"frame":14,"arrows":[{"a":"R/c/n","b":"L/c/n","kind":"save","num":1,"side":null,"bulge":30,"t":0.5},{"a":"R/c/n/usr/local","b":"L/c/n/usr/local","kind":"save","num":null,"side":null,"bulge":30,"t":0.5},{"a":"R/c/n/www","b":"L/c/n/www","kind":"save","num":2,"side":null,"bulge":30,"t":0.5}]},{"kind":"act","where":"Act III","title":"A new foundation version","html":"<p>Five weeks later FreeBSD publishes an errata notice for 15.1. The fix lands on <code>releng/15.1<\/code>. For this story, suppose it also changed <code>/etc/ssh/sshd_config<\/code> and added a system user to <code>/etc/master.passwd<\/code> and <code>/etc/group<\/code>: exactly the files the admin edited too.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"],"R/c/n":["s1"],"R/c/n/tmp":["s1"],"R/c/n/usr":["s1"],"R/c/n/usr/local":["s1"],"R/c/n/var":["s1"],"R/c/n/www":["s1"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{},"arrows":[],"frame":0},{"kind":"frame","where":"Act III, frame 15","title":"Rebuild the same foundation","html":"<p>The admin runs the same command. Because <code>generic<\/code> exists, this is an update of it, and there is one more check: the recipe's datasets must match the ones v1 has, because every container's datasets are clones of those.<\/p><pre class=\"\"><code>$ shtetl build generic\nfoundation generic, update: v1 -&gt; @15.1-releng-2026-11-12-5b2c7e01a9d4\n\n  recipe   unchanged checks pass (parse, schema, meaning)\n  datasets same as v1: tmp usr usr/local var (none added or dropped)\n  src      fast/shtetl/src: pull releng/15.1 (0f691888dc56 -&gt; 5b2c7e01a9d4)\n  build    buildworld buildkernel, obj reused from foundation-builds\n  install  into the same datasets, then delete-old delete-old-libs\n  snapshot -r @15.1-releng-2026-11-12-5b2c7e01a9d4  shtetl:kind=version\n\nproceed? [y/N] y<\/code><\/pre><div class=\"callout callout-note\"><div class=\"ctitle\">Why the same datasets<\/div><p>Building v2 into the datasets v1 lives in keeps every version on one snapshot chain. zfs_rebase needs that to find a base, and zlake can then send zrun an incremental instead of a whole world.<\/p><\/div><div class=\"callout callout-note\"><div class=\"ctitle\">A new release is just a new version<\/div><p>Had the recipe moved to <code>releng/15.2<\/code>, the build would go into the same dataset and the version would be <code>@15.2-releng-...<\/code>. Installing a newer world over an older one and running delete-old is FreeBSD's own source-upgrade path, and every container keeps a lineage to rebase along; its recipe's <code>ver<\/code> decides whether it may follow.<\/p><\/div>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["C","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"],"R/c/n":["s1"],"R/c/n/tmp":["s1"],"R/c/n/usr":["s1"],"R/c/n/usr/local":["s1"],"R/c/n/var":["s1"],"R/c/n/www":["s1"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"0f691888dc56","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{},"frame":15,"arrows":[]},{"kind":"frame","where":"Act III, frame 16","title":"Build and install over v1","html":"<p>The same mounts as before; the obj cache is already warm.<\/p><p><b>1<\/b> <code>buildworld buildkernel<\/code>, reusing the obj tree. <b>2<\/b> <code>installworld installkernel distribution<\/code> over v1, then <code>make delete-old delete-old-libs DESTDIR=...<\/code> to remove anything the new build no longer installs.<\/p>\n<p>Known cost: installworld rewrites every file, so to zfs_rebase every file of the foundation looks changed between v1 and v2 and is decided on content. <code>install -C<\/code> leaves a byte-identical file untouched (FreeBSD already installs libraries that way); using it for everything would let the rebase skip unchanged files without reading them. On a real world it cut the send from 1,010 MiB to 38 MiB (P12); adopting it is planning.md's Q-O.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/local","L/c/n/var","L/c/n/www","L/f","L/f/G","L/f/G/tmp","L/f/G/usr","L/f/G/usr/local","L/f/G/var","L/fb","L/fb/G","L/s","R","R/c","R/c/n","R/c/n/tmp","R/c/n/usr","R/c/n/usr/local","R/c/n/var","R/c/n/www","R/f","R/f/G","R/f/G/tmp","R/f/G/usr","R/f/G/usr/local","R/f/G/var","R/s"],"mounted":["B","C","L/f/G","L/f/G/tmp","L/f/G/usr/local","L/f/G/var","L/fb/G","R/c","R/c/n","R/c/n/tmp","R/c/n/usr/local","R/c/n/var","R/c/n/www"],"pills":{"L/f/G":["v1"],"L/f/G/tmp":["v1"],"L/f/G/usr":["v1"],"L/f/G/usr/local":["v1"],"L/f/G/var":["v1"],"R/f/G":["v1"],"R/f/G/tmp":["v1"],"R/f/G/usr":["v1"],"R/f/G/usr/local":["v1"],"R/f/G/var":["v1"],"R/c/n":["s1"],"R/c/n/tmp":["s1"],"R/c/n/usr":["s1"],"R/c/n/usr/local":["s1"],"R/c/n/var":["s1"],"R/c/n/www":["s1"],"L/c/n":["s1"],"L/c/n/tmp":["s1"],"L/c/n/usr":["s1"],"L/c/n/usr/local":["s1"],"L/c/n/var":["s1"],"L/c/n/www":["s1"]},"tags":{"B/t":"5b2c7e01a9d4","R/c":"/containers","R/f":"/shtetl/foundations","L/f/G/usr":"canmount=off","R/f/G":"ro","R/f/G/tmp":"ro","R/f/G/usr":"ro, canmount=off","R/f/G/usr/local":"ro","R/f/G/var":"ro","R/c/n":"/containers/nginx  jail","R/c/n/usr":"canmount=off","R/c/n/www":"container-only"}},"hl":{"B/t":"write","L/fb/G":"write","L/f/G":"write","L/f/G/var":"write"},"frame":16,"arrows":[{"a":"B/t","b":"L/fb/G","kind":"build","num":1,"side":null,"bulge":30,"t":0.5},{"a":"L/fb/G","b":"L/f/G","kind":"install","num":2,"side":"R","bulge":34,"t":0.5}]},{"kind":"frame","where":"Act III, frame 17","title":"Snapshot: version v2","html":"<p><code>@15.1-releng-2026-11-12-5b2c7e01a9d4<\/code>, called <b>v2<\/b> from here on. zlake's foundation now carries both versions on one chain.<\/p>","state":{"present":["B","B/t","C","C/c","C/cn","C/dc","C/f","C/fg","C/sc","L","L/a","L/a/c","L/c","L/c/n","L/c/n/tmp","L/c/n/usr","L/c/n/usr/l
