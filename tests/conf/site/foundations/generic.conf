# A foundation: FreeBSD 15.1 with two patch sources.
ver = ">=15";
src_branch = "releng/15.1";
kernconf_file = "GENERIC";
kernconf_lines = <<EOD
nooptions INVARIANTS
nooptions WITNESS
EOD
buildopts = <<EOD
WITHOUT_LIB32=yes
WITH_META_MODE=yes
EOD
patches {
    "github.com/eidelbyte/freebsd-patches" { ref = "releng-15.1"; }
    "patches/generic" {}
}
datasets {
    "usr/local" { compression = "zstd-9"; }
}
