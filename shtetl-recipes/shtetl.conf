# shtetl.conf: this site's settings, and the default of every recipe.
#
# Settings (planning.md 5.2): spaces, properties, build, update,
# retention. Each has a built-in value; what is written here overrides
# it, and properties.<space> overrides properties.default.
#
# The default recipe (planning.md 5.4): any recipe key, of any kind.
# Every recipe takes the keys of its own kind from here. What stacks
# (ver, pkg, datasets, requires, patches, commands, buildopts,
# kernconf_lines, jailconf) stacks with what a recipe gives; to be rid
# of a value that stacks, take it out of this file. What a recipe
# gives again of the rest (src_branch, kernconf_file, a derivation, a
# field of an entry, a dataset's property) overrides the value here.

# FreeBSD 15.1 is shtetl's floor: zfs_rebase needs it (planning.md 3).
ver = ">=15.1";

# The kernel config every foundation starts from; kernconf_lines in a
# foundation's recipe add to it.
kernconf_file = "GENERIC";
